<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── helpers ──────────────────────────────────────────────────
let _uid = 0;
const uid = () => `r${++_uid}_${Date.now()}`;
const n = v => { const x = parseFloat(String(v).replace(/,/g, '')); return isNaN(x) ? 0 : x; };
const calcTotal = r => n(r.opd) + n(r.xray) + n(r.popd) + n(r.pt) + n(r.lab) + n(r.medicals);
const inr = v => { const x = typeof v === 'number' ? v : n(v); return x === 0 ? '' : x.toLocaleString('en-IN'); };
const inrZ = v => { const x = typeof v === 'number' ? v : n(v); return '₹' + x.toLocaleString('en-IN'); };
const today = () => new Date().toISOString().slice(0, 10);
const offsetDate = (iso, d) => { const dt = new Date(iso + 'T00:00:00'); dt.setDate(dt.getDate() + d); return dt.toISOString().slice(0, 10); };
const fmtDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
const fmtDateShort = iso => { if(!iso) return '—'; const d = new Date(iso+'T00:00:00'); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; };
const makeRow = () => ({ id: uid(), mrn: '', name: '', type: 'N', opd: '', xray: '', popd: '', pt: '', lab: '', medicals: '', mode: 'Cash', cash: '', gpay: '' });
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ── Google Sheets Sync ───────────────────────────────────────
const GS_URL_KEY = 'vh-gs-url';
const GS_LAST_KEY = 'vh-gs-last';

function getGsUrl() { try { return localStorage.getItem(GS_URL_KEY)||''; } catch { return ''; } }
function setGsUrl(u) { try { localStorage.setItem(GS_URL_KEY, u); } catch {} }
function getGsLast() { try { return localStorage.getItem(GS_LAST_KEY)||''; } catch { return ''; } }
function setGsLast(t) { try { localStorage.setItem(GS_LAST_KEY, t); } catch {} }

async function syncToSheets(allData, ipRecords, url) {
  if (!url || !url.includes('script.google.com')) return { ok: false, msg: 'No URL' };
  try {
    const payload = { action: 'backup', payload: { allData, ipData: ipRecords } };
    const encoded = encodeURIComponent(JSON.stringify(payload));
    // Use GET with data as URL param — only way to avoid CORS body stripping
    const getUrl = url + '?data=' + encoded;
    await fetch(getUrl, { mode: 'no-cors' });
    const ts = new Date().toLocaleString('en-IN');
    setGsLast(ts);
    return { ok: true, msg: ts };
  } catch (e) {
    return { ok: false, msg: e.message || 'Network error' };
  }
}

const cellBase = { border:'none', outline:'none', background:'transparent', height:'100%', fontFamily:"'Noto Sans Mono',monospace", fontSize:12, color:'var(--t1)', display:'block' };

function Num({ val, onChange, onKeyDown, inputRef, readOnly }) {

function DayView({ allData, setAllData, date, setDate }) {
  const rows=(allData[date]&&allData[date].length>0)?allData[date]:[makeRow()];
  function setRows(nr){const up={...allData,[date]:nr};setAllData(up);try{localStorage.setItem('vh-day-data',JSON.stringify(up));}catch{}}
  function updateRow(id,field,value){

      if(r.id!==id) return r;
      const up={...r,[field]:value};
      const rev=['opd','xray','popd','pt','lab','medicals'];
      if(rev.includes(field)||field==='mode'){const t=calcTotal(up);if(up.mode==='Cash'){up.cash=t>0?inr(t):'';up.gpay='';}else if(up.mode==='GPay'){up.gpay=t>0?inr(t):'';up.cash='';}}
      return up;
    }));
  }
  return (
    <>
      <DateNav date={date} onChange={setDate}/>
      <PatientTable rows={rows} onUpdate={updateRow}
        onDelete={id=>{const nr=rows.filter(r=>r.id!==id);setRows(nr.length?nr:[makeRow()]);}}
        onAdd={()=>setRows([...rows,makeRow()])}/>
      <DayKpis rows={rows}/>
    </>
  );
}

function MonthTable({ year, month, allData, ipData, setIpData, onDayClick }) {
  const days=daysInMonth(year,month);
  const td=today();
  const rows=Array.from({length:days},(_,i)=>{
    const d=i+1; const iso=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const stats=getDayStats(allData[iso]); const ip=ipData[iso]||{ipName:'',ipDiag:'',ipBill:'',ipMed:''};
    const dow=new Date(iso+'T00:00:00').getDay();
    return {iso,d,dow,stats:stats?{...stats,...ip,_ipName:ip.ipName}:{...ip,_ipName:ip.ipName},isToday:iso===td,isSun:dow===0};
  });
  const totals={}; const numKeys=['cash','gpay','total','med','opd_rev','pts','N','O','OGN','OGO','xray','pt','lab','xpl','ipBill','ipMed'];
  numKeys.forEach(k=>totals[k]=rows.reduce((s,r)=>s+n(r.stats[k]||0),0));
  function updateIp(iso,field,val){const up={...ipData,[iso]:{...(ipData[iso]||{}),[field]:val}};setIpData(up);try{localStorage.setItem('vh-month-ip',JSON.stringify(up));}catch{}}
  const thBase=(c,grpBg)=>({position:c.sticky?'sticky':undefined,left:c.sticky?c.left:undefined,zIndex:c.sticky?4:undefined,background:grpBg||'var(--g7)',color:'rgba(255,255,255,0.85)',fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px',padding:'0 5px',textAlign:c.align,whiteSpace:'nowrap',width:c.w,minWidth:c.w,userSelect:'none'});
  const groupTh=(grpBg)=>({background:grpBg,color:'rgba(255,255,255,0.6)',fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',padding:'3px 5px',textAlign:'center',borderBottom:'1px solid rgba(255,255,255,0.15)'});
  return (
    <div style={{flex:1,overflow:'auto',width:'100%'}}>
      <table className="mth-tbl" style={{borderCollapse:'collapse',width:'100%',minWidth:1180}}>
        <colgroup>{MC.map(c=><col key={c.key} style={{width:c.w,minWidth:c.w}}/>)}</colgroup>
        <thead style={{position:'sticky',top:0,zIndex:10}}>
          <tr style={{height:20}}>
            <th colSpan={2} style={groupTh('var(--g7)')}></th>
            <th colSpan={5} style={groupTh('#1D5C3B')}>Revenue</th>
            <th colSpan={5} style={groupTh('#1A4F38')}>Patients</th>
            <th colSpan={4} style={groupTh('#154030')}>Procedures</th>
            <th colSpan={4} style={groupTh('#102E22')}>Inpatient</th>
          </tr>
          <tr style={{height:28}}>
            {MC.map((c,ci)=>{let bg='var(--g7)';if(ci>=2&&ci<=6)bg='#1D5C3B';else if(ci>=7&&ci<=11)bg='#1A4F38';else if(ci>=12&&ci<=15)bg='#154030';else if(ci>=16)bg='#102E22';return<th key={c.key} style={thBase(c,bg)}>{c.label}</th>;})}
          </tr>
        </thead>
        <tbody>
          {rows.map(({iso,d,dow,stats,isToday,isSun})=>{
            const hasData=stats.pts>0; const rowBg=isToday?'#F0FBF5':isSun?'#FFF8F7':d%2===0?'#fff':'#FAFCFA';
            const tdS=(c,ex={})=>({position:c.sticky?'sticky':undefined,left:c.sticky?c.left:undefined,zIndex:c.sticky?2:undefined,background:c.sticky?(isToday?'#F0FBF5':isSun?'#FFF5F5':rowBg):undefined,height:28,borderBottom:'1px solid var(--bd)',padding:0,textAlign:c.align,fontSize:12,width:c.w,minWidth:c.w,...ex});
            const cell=(v,bold,color)=><span style={{display:'block',padding:'0 5px',fontFamily:"'Noto Sans Mono',monospace",fontVariantNumeric:'tabular-nums',fontWeight:bold?700:400,color:color||'var(--t1)'}}>{v}</span>;
            return (
              <tr key={iso} style={{background:rowBg,cursor:hasData?'pointer':'default'}} onClick={()=>onDayClick(iso)}
                onMouseEnter={e=>e.currentTarget.style.background='var(--g0)'} onMouseLeave={e=>e.currentTarget.style.background=rowBg}>
                <td className="sticky" style={{...tdS(MC[0]),fontWeight:isToday?700:500,color:isToday?'var(--g7)':'var(--t2)',fontFamily:"'Noto Sans Mono',monospace",textAlign:'center'}}>{String(d).padStart(2,'0')}</td>
                <td className="sticky" style={{...tdS(MC[1]),fontSize:10,color:isSun?'var(--red)':'var(--t3)',fontWeight:600,textAlign:'center'}}>{DAYS[dow]}</td>
                <td style={tdS(MC[2])}>{cell(stats.cash?inr(stats.cash):'',false,stats.cash?'var(--grntx)':null)}</td>
                <td style={tdS(MC[3])}>{cell(stats.gpay?inr(stats.gpay):'',false,stats.gpay?'var(--blutx)':null)}</td>
                <td style={tdS(MC[4])}>{cell(stats.total?inr(stats.total):'',true,stats.total?'var(--g7)':null)}</td>
                <td style={tdS(MC[5])}>{cell(stats.med?inr(stats.med):'',false,stats.med?'#6B21A8':null)}</td>
                <td style={tdS(MC[6])}>{cell(stats.opd_rev?inr(stats.opd_rev):'',false)}</td>
                <td style={tdS(MC[7])}>{cell(stats.pts||'',stats.pts>0,stats.pts?'var(--t1)':null)}</td>
                <td style={tdS(MC[8])}>{cell(stats.N||'',false,stats.N?'var(--blutx)':null)}</td>
                <td style={tdS(MC[9])}>{cell(stats.O||'',false,stats.O?'var(--g7)':null)}</td>
                <td style={tdS(MC[10])}>{cell(stats.OGN||'',false,stats.OGN?'var(--ambtx)':null)}</td>
                <td style={tdS(MC[11])}>{cell(stats.OGO||'',false,stats.OGO?'#713F12':null)}</td>
                <td style={tdS(MC[12])}>{cell(stats.xray?inr(stats.xray):'')}</td>
                <td style={tdS(MC[13])}>{cell(stats.pt?inr(stats.pt):'',false,stats.pt?'#9F1239':null)}</td>
                <td style={tdS(MC[14])}>{cell(stats.lab?inr(stats.lab):'',false,stats.lab?'var(--grntx)':null)}</td>
                <td style={tdS(MC[15])}>{cell(stats.xpl?inr(stats.xpl):'',false,stats.xpl?'var(--ambtx)':null)}</td>
                <td style={tdS(MC[16])} onClick={e=>e.stopPropagation()}><Txt val={stats.ipName||''} onChange={v=>updateIp(iso,'ipName',v)} placeholder="—"/></td>
                <td style={tdS(MC[17])} onClick={e=>e.stopPropagation()}><Txt val={stats.ipDiag||''} onChange={v=>updateIp(iso,'ipDiag',v)} placeholder="—"/></td>
                <td style={tdS(MC[18])} onClick={e=>e.stopPropagation()}><Num val={stats.ipBill||''} onChange={v=>updateIp(iso,'ipBill',v)}/></td>
                <td style={tdS(MC[19])} onClick={e=>e.stopPropagation()}><Num val={stats.ipMed||''} onChange={v=>updateIp(iso,'ipMed',v)}/></td>
              </tr>
            );
          })}
          <tr style={{background:'#F0F7F3',position:'sticky',bottom:0}}>
            <td colSpan={2} style={{padding:'5px 8px',fontWeight:700,fontSize:11,color:'var(--t2)',borderTop:'2px solid var(--g7)',position:'sticky',left:0,background:'#F0F7F3'}}>TOTAL</td>
            {['cash','gpay','total','med','opd_rev'].map(k=><td key={k} style={{padding:'5px 5px',textAlign:'right',fontFamily:'Noto Sans Mono,monospace',fontWeight:700,fontSize:12,color:k==='total'?'var(--g7)':'var(--t1)',borderTop:'2px solid var(--g7)'}}>{totals[k]>0?inr(totals[k]):''}</td>)}
            {['pts','N','O','OGN','OGO'].map(k=><td key={k} style={{padding:'5px 5px',textAlign:'center',fontFamily:'Noto Sans Mono,monospace',fontWeight:700,fontSize:12,borderTop:'2px solid var(--g7)'}}>{totals[k]||''}</td>)}
            {['xray','pt','lab','xpl'].map(k=><td key={k} style={{padding:'5px 5px',textAlign:'right',fontFamily:'Noto Sans Mono,monospace',fontWeight:700,fontSize:12,borderTop:'2px solid var(--g7)'}}>{totals[k]>0?inr(totals[k]):''}</td>)}
            {['ipBill','ipMed'].map(k=><td key={k} style={{padding:'5px 5px',textAlign:'right',fontFamily:'Noto Sans Mono,monospace',fontWeight:700,fontSize:12,borderTop:'2px solid var(--g7)'}}>{totals[k]>0?inr(totals[k]):''}</td>)}
            <td colSpan={2} style={{borderTop:'2px solid var(--g7)'}}></td>
          </tr>
        </tbody>
      </table>
    </div>
  );
}

function MonthView({ allData, setDate, setTab }) {
  const td=today(); const ty=parseInt(td.slice(0,4)); const tm=parseInt(td.slice(5,7))-1;
  const [year,setYear]=useState(ty); const [month,setMonth]=useState(tm);
  const [ipData,setIpData]=useState(()=>{try{return JSON.parse(localStorage.getItem('vh-month-ip')||'{}');}catch{return {};}});
  const days=daysInMonth(year,month);
  const stats=Array.from({length:days},(_,i)=>{const d=i+1;const iso=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const s=getDayStats(allData[iso]);const ip=ipData[iso]||{};return s?{...s,_ipName:ip.ipName||''}:{_ipName:ip.ipName||''};});
  function onDayClick(iso){setDate(iso);setTab('Day');}
  return (
    <>
      <MonthYearNav year={year} month={month} onChange={(y,m)=>{setYear(y);setMonth(m);}}/>
      <MonthKpis stats={stats}/>
      <MonthTable year={year} month={month} allData={allData} ipData={ipData} setIpData={setIpData} onDayClick={onDayClick}/>
    </>
  );
}

const IP_EMPTY = () => ({id:uid(),name:'',admitDate:today(),dischargeDate:'',ward:'General',status:'Admitted',diagnosis:'',bill:'',medicines:'',anaesthetist:'',notes:''});

function AdmitModal({ record, onSave, onClose }) {
  const [form, setForm] = useState(record ? {...record} : IP_EMPTY());
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const F = ({label,children,full})=>(
    <div className={`form-field${full?' form-full':''}`}>
      <label className="form-label">{label}</label>
      {children}
    </div>
  );
  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-box">
        <div className="modal-header">
          <span style={{fontSize:14,fontWeight:700}}>{record?'Edit Patient':'Admit Patient'}</span>
          <button onClick={onClose} style={{background:'none',border:'none',color:'rgba(255,255,255,0.8)',fontSize:18,cursor:'pointer',lineHeight:1,padding:'2px 6px'}}>×</button>
        </div>
        <div className="modal-body">
          <div className="form-grid">
            <F label="Patient Name" full><input className="form-input" value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Full name" autoFocus/></F>
            <F label="Admit Date"><input className="form-input mono" type="date" value={form.admitDate} onChange={e=>set('admitDate',e.target.value)}/></F>
            <F label="Discharge Date"><input className="form-input mono" type="date" value={form.dischargeDate} onChange={e=>set('dischargeDate',e.target.value)}/></F>
            <F label="Ward">
              <select className="form-input" value={form.ward} onChange={e=>set('ward',e.target.value)}>
                <option>General</option><option>Private</option>
              </select>
            </F>
            <F label="Status">
              <select className="form-input" value={form.status} onChange={e=>set('status',e.target.value)}>
                <option>Admitted</option><option>Discharged</option><option>LAMA</option>
              </select>
            </F>
            <F label="Diagnosis" full><input className="form-input" value={form.diagnosis} onChange={e=>set('diagnosis',e.target.value)} placeholder="Primary diagnosis"/></F>
            <F label="Bill ₹"><input className="form-input mono" value={form.bill} onChange={e=>set('bill',e.target.value)} inputMode="decimal" placeholder="0"/></F>
            <F label="Medicines ₹"><input className="form-input mono" value={form.medicines} onChange={e=>set('medicines',e.target.value)} inputMode="decimal" placeholder="0"/></F>
            <F label="Anaesthetist" full><input className="form-input" value={form.anaesthetist} onChange={e=>set('anaesthetist',e.target.value)} placeholder="Name (if applicable)"/></F>
            <F label="Notes" full><textarea className="form-input" value={form.notes} onChange={e=>set('notes',e.target.value)} placeholder="Additional notes…"/></F>
          </div>
        </div>
        <div className="modal-footer">
          <button onClick={onClose} style={{border:'1px solid var(--bd2)',background:'var(--w)',borderRadius:7,padding:'8px 18px',cursor:'pointer',fontSize:13,fontWeight:600,color:'var(--t2)'}}>Cancel</button>
          <button onClick={()=>{if(!form.name.trim()) return;onSave(form);}} style={{background:'var(--g7)',color:'#fff',border:'none',borderRadius:7,padding:'8px 18px',cursor:'pointer',fontSize:13,fontWeight:600}}>
            {record?'Save changes':'Admit'}
          </button>
        </div>
      </div>
    </div>
  );
}

  {key:'dischargeDate',label:'Discharge',w:90,align:'center'},

  {key:'bill',label:'Bill ₹',w:82,align:'right'},
  {key:'medicines',label:'Med ₹',w:74,align:'right'},
  {key:'total',label:'Total ₹',w:82,align:'right',ro:true},
  {key:'status',label:'Status',w:94,align:'center'},
  {key:'anaesthetist',label:'Anaesthetist',w:110,align:'left'},

function IpTable({ records, onEdit, onDelete }) {
  const totBill=records.reduce((s,r)=>s+n(r.bill),0);
  const totMed=records.reduce((s,r)=>s+n(r.medicines),0);
  const totTotal=records.reduce((s,r)=>s+n(r.bill)+n(r.medicines),0);
  const thS=c=>({width:c.grow||c.grow2?'auto':c.w,minWidth:c.w,textAlign:c.align,padding:'0 8px',fontWeight:600,fontSize:10,color:'rgba(255,255,255,0.85)',textTransform:'uppercase',letterSpacing:'0.5px',userSelect:'none',whiteSpace:'nowrap'});
  const tdS=(c,ex={})=>({width:c.grow||c.grow2?'auto':c.w,minWidth:c.w,height:34,borderBottom:'1px solid var(--bd)',padding:'0 8px',verticalAlign:'middle',fontSize:12,...ex});

  const StatusBadge = ({status}) => { const cfg=STATUS_CFG[status]||STATUS_CFG.Admitted; return <span style={{background:cfg.bg,color:cfg.tx,fontSize:10,fontWeight:700,padding:'3px 8px',borderRadius:999}}>{status}</span>; };
  const WardBadge = ({ward}) => { const cfg=WARD_CFG[ward]||WARD_CFG.General; return <span style={{background:cfg.bg,color:cfg.tx,fontSize:10,fontWeight:600,padding:'3px 8px',borderRadius:4,border:`1px solid ${cfg.tx}33`}}>{ward}</span>; };

  if(!records.length) return (
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:8,color:'var(--dis)'}}>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
      <span style={{fontSize:13}}>No inpatients this month</span>

  return (
    <div style={{flex:1,overflowY:'auto',overflowX:'auto',width:'100%',background:'var(--w)'}}>
      <table style={{borderCollapse:'collapse',width:'100%',minWidth:900}}>

        <thead style={{position:'sticky',top:0,zIndex:10}}>
          <tr style={{background:'var(--g7)',height:30}}>{IP_COLS.map(c=><th key={c.key} style={thS(c)}>{c.label}</th>)}</tr>
        </thead>
        <tbody>
          {records.map((r,i)=>{
            const tot=n(r.bill)+n(r.medicines); const rowBg=i%2===0?'#fff':'#FAFCFA';
            return (
              <tr key={r.id} style={{background:rowBg}} onMouseEnter={e=>e.currentTarget.style.background='var(--g0)'} onMouseLeave={e=>e.currentTarget.style.background=rowBg}>
                <td style={{...tdS(IP_COLS[0]),fontWeight:600,color:'var(--t1)'}}>{r.name}</td>
                <td style={{...tdS(IP_COLS[1]),fontFamily:'Noto Sans Mono,monospace',textAlign:'center',color:'var(--t2)'}}>{fmtDateShort(r.admitDate)}</td>

                <td style={{...tdS(IP_COLS[3]),textAlign:'center'}}><WardBadge ward={r.ward}/></td>
                <td style={{...tdS(IP_COLS[4]),color:'var(--t2)'}}>{r.diagnosis||'—'}</td>

                <td style={{...tdS(IP_COLS[7]),fontFamily:'Noto Sans Mono,monospace',textAlign:'right',fontWeight:700,color:'var(--g7)'}}>{tot>0?inr(tot):''}</td>

                <td style={{...tdS(IP_COLS[9]),color:'var(--t3)',fontSize:11}}>{r.anaesthetist||'—'}</td>

          </tr>

      </table>
    </div>
  );
}

function IpView({ ipRecords, setIpRecords }) {
  const td=today(); const ty=parseInt(td.slice(0,4)); const tm=parseInt(td.slice(5,7))-1;
  const [year,setYear]=useState(ty); const [month,setMonth]=useState(tm);
  const records = ipRecords;
  const [modal,setModal]=useState(null);

  function saveRecords(r){setIpRecords(r);try{localStorage.setItem('vh-ip-records',JSON.stringify(r));}catch{}}

  const monthStr=`${year}-${String(month+1).padStart(2,'0')}`;
  const filtered=records.filter(r=>r.admitDate&&r.admitDate.startsWith(monthStr));

  function handleSave(form){
    if(modal==='new'){saveRecords([...records,{...form,id:form.id||uid()}]);}
    else{saveRecords(records.map(r=>r.id===form.id?form:r));}
    setModal(null);
  }
  function handleDelete(id){if(confirm('Delete this patient record?'))saveRecords(records.filter(r=>r.id!==id));}

  // KPI tiles
  const totBill=filtered.reduce((s,r)=>s+n(r.bill),0);
  const totMed=filtered.reduce((s,r)=>s+n(r.medicines),0);
  const admitted=filtered.filter(r=>r.status==='Admitted').length;
  const discharged=filtered.filter(r=>r.status==='Discharged').length;
  const lama=filtered.filter(r=>r.status==='LAMA').length;

  const T=({label,value,color,bg})=>(
    <div style={{background:bg||'var(--w)',border:`1px solid ${color||'var(--bd)'}`,borderRadius:7,padding:'8px 14px',flex:'1 1 0',minWidth:0}}>
      <div style={{fontSize:9,fontWeight:700,color:color||'var(--t3)',textTransform:'uppercase',letterSpacing:'0.7px',whiteSpace:'nowrap'}}>{label}</div>
      <div style={{fontSize:20,fontWeight:700,fontFamily:"'Noto Sans Mono',monospace",color:color||'var(--t1)',lineHeight:1.2,marginTop:3}}>{value}</div>
    </div>
  );

  return (
    <>
      <MonthYearNav year={year} month={month} onChange={(y,m)=>{setYear(y);setMonth(m);}}>
        <button onClick={()=>setModal('new')} style={{background:'var(--g7)',color:'#fff',border:'none',borderRadius:7,padding:'6px 14px',cursor:'pointer',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',gap:5}}>
          <span style={{fontSize:16,lineHeight:1}}>+</span> Admit Patient
        </button>
      </MonthYearNav>
      {/* KPI row */}
      <div style={{background:'var(--bg)',borderBottom:'1px solid var(--bd)',padding:'8px 12px',display:'flex',gap:8,flexShrink:0,width:'100%'}}>
        <T label="Total Patients" value={filtered.length}/>
        <T label="Admitted" value={admitted} color="var(--blutx)" bg="var(--blubg)"/>
        <T label="Discharged" value={discharged} color="var(--grntx)" bg="var(--grnbg)"/>
        <T label="LAMA" value={lama} color="var(--ambtx)" bg="var(--ambbg)"/>
        <T label="Bill Total ₹" value={inrZ(totBill)} color="var(--g7)" bg="var(--g1)"/>
        <T label="Medicines ₹" value={inrZ(totMed)} color="#6B21A8" bg="#F3E8FF"/>
        <T label="Grand Total ₹" value={inrZ(totBill+totMed)} color="var(--g7)" bg="var(--g1)"/>
      </div>
      <IpTable records={filtered} onEdit={r=>setModal(r)} onDelete={handleDelete}/>
      {modal&&<AdmitModal record={modal==='new'?null:modal} onSave={handleSave} onClose={()=>setModal(null)}/>}
    </>
  );
}

// ═══════════════════════════════════════════════════════════════
// PHARMA TAB
// ═══════════════════════════════════════════════════════════════
const PHARMA_KEY='vh-pharma-data';
const PHARMA_AGENCIES_KEY='vh-pharma-agencies';

function PharmaView(){
  const td=today(); const ty=parseInt(td.slice(0,4)); const tm=parseInt(td.slice(5,7))-1;
  const [year,setYear]=useState(ty); const [month,setMonth]=useState(tm);
  const [entries,setEntries]=useState(()=>{try{return JSON.parse(localStorage.getItem(PHARMA_KEY)||'[]');}catch{return [];}});
  const [agencies,setAgencies]=useState(()=>{try{return JSON.parse(localStorage.getItem(PHARMA_AGENCIES_KEY)||'[]');}catch{return [];}});
  const [newAgency,setNewAgency]=useState('');

  function saveEntries(e){setEntries(e);try{localStorage.setItem(PHARMA_KEY,JSON.stringify(e));}catch{}}
  function saveAgencies(a){setAgencies(a);try{localStorage.setItem(PHARMA_AGENCIES_KEY,JSON.stringify(a));}catch{}}

  const monthStr=`${year}-${String(month+1).padStart(2,'0')}`;
  const monthEntries=entries.filter(e=>e.date&&e.date.startsWith(monthStr));

  // All agencies = managed list ∪ agencies seen in entries
  const allAgencyNames=[...new Set([...agencies,...entries.map(e=>e.agency).filter(Boolean)])].sort();

  function addAgency(){
    const name=newAgency.trim();
    if(!name){return;}
    if(agencies.includes(name)){setNewAgency('');return;}
    saveAgencies([...agencies,name]);
    setNewAgency('');
  }

  function addEntry(agency,date,amount,paid,mode){
    if(!date||!amount||n(amount)<=0){alert('Date and amount required');return;}
    if(!agencies.includes(agency))saveAgencies([...agencies,agency]);
    saveEntries([...entries,{id:uid(),date,agency,amount:n(amount),paid:n(paid),mode}]);
  }

  function deleteEntry(id){if(confirm('Delete this entry?'))saveEntries(entries.filter(e=>e.id!==id));}

  function bulkSetPaid(agency,total){
    // Distribute oldest-first across this agency's entries (all months, oldest first)
    const t=n(total);
    if(t<0){alert('Invalid amount');return;}
    const agencyEntries=entries.filter(e=>e.agency===agency).sort((a,b)=>a.date.localeCompare(b.date));
    let remaining=t;
    const updated=new Map();
    for(const e of agencyEntries){
      const can=Math.min(remaining,e.amount);
      updated.set(e.id,can);
      remaining-=can;
      if(remaining<=0)break;
    }
    saveEntries(entries.map(e=>e.agency===agency?{...e,paid:updated.has(e.id)?updated.get(e.id):0}:e));
  }

  // Month totals
  const totAmt=monthEntries.reduce((s,e)=>s+n(e.amount),0);
  const totPaid=monthEntries.reduce((s,e)=>s+n(e.paid),0);
  const totDue=totAmt-totPaid;

  return (
    <>
      <MonthYearNav year={year} month={month} onChange={(y,m)=>{setYear(y);setMonth(m);}}>
        <div style={{display:'flex',alignItems:'center',gap:14,fontSize:12}}>
          <span style={{color:'var(--t2)'}}>Total: <b style={{color:'var(--t1)',fontFamily:"'Noto Sans Mono',monospace"}}>{inrZ(totAmt)}</b></span>
          <span style={{color:'var(--t2)'}}>Paid: <b style={{color:'var(--grntx)',fontFamily:"'Noto Sans Mono',monospace"}}>{inrZ(totPaid)}</b></span>
          <span style={{color:'var(--t2)'}}>Due: <b style={{color:'var(--redtx)',fontFamily:"'Noto Sans Mono',monospace"}}>{inrZ(totDue)}</b></span>
        </div>
      </MonthYearNav>

      {/* Add agency row */}
      <div style={{background:'var(--bg)',borderBottom:'1px solid var(--bd)',padding:'8px 12px',display:'flex',gap:8,alignItems:'center',flexShrink:0}}>
        <input value={newAgency} onChange={e=>setNewAgency(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')addAgency();}} placeholder="New agency name"
          style={{flex:'0 0 240px',border:'1px solid var(--bd2)',borderRadius:7,padding:'7px 10px',fontSize:12,background:'var(--w)',outline:'none'}}/>
        <button onClick={addAgency} style={{background:'var(--g7)',color:'#fff',border:'none',borderRadius:7,padding:'7px 14px',cursor:'pointer',fontSize:12,fontWeight:700}}>+ Add Agency</button>
        <span style={{color:'var(--t3)',fontSize:11,marginLeft:8}}>{allAgencyNames.length} agencies</span>
      </div>

      {/* Cards grid */}
      <div style={{flex:1,overflowY:'auto',background:'var(--bg)',padding:12}}>
        {allAgencyNames.length===0 ? (
          <div style={{textAlign:'center',color:'var(--t3)',padding:'40px 0',fontSize:13}}>No agencies yet. Add one above to get started.</div>
        ) : (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:10}}>
            {allAgencyNames.map(ag=><AgencyCard key={ag} agency={ag} monthEntries={monthEntries.filter(e=>e.agency===ag)} allEntries={entries.filter(e=>e.agency===ag)} onAdd={(d,a,p,m)=>addEntry(ag,d,a,p,m)} onDelete={deleteEntry} onBulkPaid={t=>bulkSetPaid(ag,t)}/>)}
          </div>
        )}
      </div>
    </>
  );
}

function AgencyCard({ agency, monthEntries, allEntries, onAdd, onDelete, onBulkPaid }){
  const [date,setDate]=useState(today());
  const [amount,setAmount]=useState('');
  const [paid,setPaid]=useState('');
  const [mode,setMode]=useState('Cash');
  const [editingPaid,setEditingPaid]=useState(false);
  const [paidDraft,setPaidDraft]=useState('');

  // Card shows month totals (matches header), but bulk paid edits across all months oldest-first
  const totAmt=monthEntries.reduce((s,e)=>s+n(e.amount),0);
  const totPaid=monthEntries.reduce((s,e)=>s+n(e.paid),0);
  const due=totAmt-totPaid;

  function submit(){
    onAdd(date,amount,paid||0,mode);
    setAmount(''); setPaid(''); // keep date+mode
  }

  function savePaid(){
    onBulkPaid(paidDraft);
    setEditingPaid(false);
  }

  return (
    <div style={{background:'var(--w)',border:'1px solid var(--bd)',borderRadius:8,padding:12,display:'flex',flexDirection:'column',gap:10}}>
      {/* Header */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
        <div style={{minWidth:0,flex:1}}>
          <div style={{fontWeight:700,fontSize:13,color:'var(--t1)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{agency}</div>
          <div style={{fontSize:11,color:'var(--t3)',fontFamily:"'Noto Sans Mono',monospace",marginTop:2}}>
            {inrZ(totAmt)}{due>0&&<> · <span style={{color:'var(--redtx)'}}>Due {inrZ(due)}</span></>}
          </div>
        </div>
        <div style={{textAlign:'right',fontSize:11,minWidth:80}}>
          <div style={{color:'var(--t3)'}}>Paid</div>
          {editingPaid ? (
            <div style={{display:'flex',gap:3,alignItems:'center',marginTop:2}}>
              <input type="number" value={paidDraft} onChange={e=>setPaidDraft(e.target.value)} autoFocus
                style={{width:70,border:'1px solid var(--bd2)',borderRadius:5,padding:'2px 5px',fontSize:11,fontFamily:"'Noto Sans Mono',monospace",textAlign:'right'}}/>
              <button onClick={savePaid} style={{background:'var(--g7)',color:'#fff',border:'none',borderRadius:4,padding:'2px 6px',fontSize:10,cursor:'pointer'}}>✓</button>
              <button onClick={()=>setEditingPaid(false)} style={{background:'var(--w)',border:'1px solid var(--bd2)',borderRadius:4,padding:'2px 6px',fontSize:10,cursor:'pointer'}}>×</button>
            </div>
          ) : (
            <div style={{display:'flex',gap:4,alignItems:'center',justifyContent:'flex-end',marginTop:2}}>
              <span style={{color:'var(--grntx)',fontWeight:700,fontFamily:"'Noto Sans Mono',monospace"}}>{inrZ(totPaid)}</span>
              <span onClick={()=>{setPaidDraft(String(totPaid));setEditingPaid(true);}} style={{cursor:'pointer',color:'var(--t3)',fontSize:11}} title="Bulk set paid (distributes oldest-first)">✎</span>
            </div>
          )}
        </div>
      </div>

      {/* Entries list */}
      <div style={{borderTop:'1px solid var(--bd)',paddingTop:8,minHeight:30}}>
        {monthEntries.length===0 ? (
          <div style={{textAlign:'center',color:'var(--dis)',fontSize:11,padding:'8px 0'}}>No entries this month</div>
        ) : (
          monthEntries.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{
            const eDue=n(e.amount)-n(e.paid);
            return (
              <div key={e.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:11,padding:'3px 0',gap:6}}>
                <span style={{color:'var(--t3)',whiteSpace:'nowrap'}}>{fmtDateShort(e.date).slice(0,5)} · {e.mode==='Bank Transfer'?'BT':'Cash'}</span>
                <span style={{display:'flex',alignItems:'center',gap:6,fontFamily:"'Noto Sans Mono',monospace"}}>
                  <span style={{color:eDue>0?'var(--redtx)':'var(--t1)'}}>{inrZ(e.amount)}</span>
                  {n(e.paid)>0&&<span style={{color:'var(--grntx)',fontSize:10}}>p {inrZ(e.paid)}</span>}
                  <span onClick={()=>onDelete(e.id)} style={{cursor:'pointer',color:'var(--red)',fontSize:13,lineHeight:1}}>×</span>
                </span>
              </div>
            );
          })
        )}
      </div>

      {/* Add row */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 80px 60px 28px',gap:4,alignItems:'center'}}>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)}
          style={{border:'1px solid var(--bd2)',borderRadius:5,padding:'5px 6px',fontSize:11,minWidth:0}}/>
        <input type="number" placeholder="Amount" value={amount} onChange={e=>setAmount(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&amount)submit();}}
          style={{border:'1px solid var(--bd2)',borderRadius:5,padding:'5px 6px',fontSize:11,fontFamily:"'Noto Sans Mono',monospace",textAlign:'right',minWidth:0}}/>
        <select value={mode} onChange={e=>setMode(e.target.value)}
          style={{border:'1px solid var(--bd2)',borderRadius:5,padding:'5px 4px',fontSize:11,minWidth:0,background:'var(--w)'}}>
          <option value="Cash">Cash</option>
          <option value="Bank Transfer">BT</option>
        </select>
        <button onClick={submit} disabled={!amount} style={{background:amount?'var(--g6)':'var(--dis)',color:'#fff',border:'none',borderRadius:5,padding:'5px 0',cursor:amount?'pointer':'not-allowed',fontSize:14,fontWeight:700,lineHeight:1}}>+</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 80px',gap:4,marginTop:-6}}>
        <span style={{fontSize:10,color:'var(--t3)',paddingLeft:2}}>Optional: paid now</span>
        <input type="number" placeholder="Paid" value={paid} onChange={e=>setPaid(e.target.value)}
          style={{border:'1px solid var(--bd2)',borderRadius:5,padding:'4px 6px',fontSize:11,fontFamily:"'Noto Sans Mono',monospace",textAlign:'right'}}/>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// SETTINGS TAB
// ═══════════════════════════════════════════════════════════════
function SettingsView({ allData, ipRecords, syncStatus, setSyncStatus }) {
  const [url, setUrl] = useState(getGsUrl);
  const [syncing, setSyncing] = useState(false);
  const [msg, setMsg] = useState('');
  const [err, setErr] = useState(false);
  const lastSync = getGsLast();

  function saveUrl() {
    setGsUrl(url.trim());
    setMsg('URL saved ✓'); setErr(false);
    setTimeout(() => setMsg(''), 2000);
  }

  async function doSync() {
    const u = getGsUrl();
    if (!u) { setMsg('Paste your Apps Script URL first'); setErr(true); return; }
    setSyncing(true); setMsg('Syncing to Google Sheets…'); setErr(false);
    const res = await syncToSheets(allData, ipRecords, u);
    setSyncing(false);
    if (res.ok) { setMsg(`✓ Synced at ${res.msg}`); setErr(false); setSyncStatus('ok'); }
    else { setMsg(`✗ Failed: ${res.msg}`); setErr(true); setSyncStatus('err'); }
  }

  const cardStyle = { background:'var(--w)', border:'1px solid var(--bd)', borderRadius:10, padding:'16px 18px', marginBottom:14 };
  const labelStyle = { fontSize:11, fontWeight:700, color:'var(--t2)', display:'block', marginBottom:5 };
  const inputStyle = { border:'1px solid var(--bd2)', borderRadius:7, padding:'8px 10px', fontSize:13, color:'var(--t1)', outline:'none', width:'100%', fontFamily:"'Noto Sans',sans-serif" };
  const btnStyle = (bg) => ({ background:bg||'var(--g7)', color:'#fff', border:'none', borderRadius:7, padding:'8px 16px', fontSize:12, fontWeight:700, cursor:'pointer' });

  return (
    <div style={{ flex:1, overflowY:'auto', padding:'16px 20px', background:'var(--bg)' }}>
      <div style={{ maxWidth:640 }}>
        <div style={{ fontWeight:700, fontSize:15, color:'var(--t1)', marginBottom:14 }}>⚙ Settings</div>

        {/* Google Sheets Sync */}
        <div style={{ ...cardStyle, borderLeft:'4px solid #34A853' }}>
          <div style={{ fontWeight:700, fontSize:13, color:'#1A7F4B', marginBottom:4 }}>☁ Google Sheets Sync</div>
          <p style={{ fontSize:12, color:'var(--t3)', marginBottom:12, lineHeight:1.6 }}>
            Paste your Google Apps Script Web App URL. Data will sync to your sheet every time you click "Sync Now".
          </p>
          <label style={labelStyle}>Apps Script Web App URL</label>
          <div style={{ display:'flex', gap:8, marginBottom:10 }}>
            <input
              style={{ ...inputStyle, flex:1 }}
              type="url"
              placeholder="https://script.google.com/macros/s/.../exec"
              value={url}
              onChange={e => setUrl(e.target.value)}
            />
            <button style={btnStyle('#1A7F4B')} onClick={saveUrl}>Save</button>
          </div>
          <div style={{ display:'flex', gap:8, alignItems:'center' }}>
            <button style={{ ...btnStyle('#34A853'), opacity: syncing?0.6:1 }} onClick={doSync} disabled={syncing}>
              {syncing ? '⟳ Syncing…' : '⬆ Sync Now'}
            </button>
            {lastSync && <span style={{ fontSize:11, color:'var(--t3)' }}>Last sync: {lastSync}</span>}
          </div>
          {msg && (
            <div style={{ marginTop:10, fontSize:12, fontWeight:600, color: err?'var(--red)':'#16A34A', padding:'7px 10px', borderRadius:6, background: err?'var(--redbg)':'var(--grnbg)' }}>
              {msg}
            </div>
          )}
        </div>

        {/* How to set up */}
        <div style={cardStyle}>
          <div style={{ fontWeight:700, fontSize:13, color:'var(--t1)', marginBottom:8 }}>📋 How to set up Google Sheets sync</div>
          <ol style={{ fontSize:12, color:'var(--t2)', paddingLeft:18, lineHeight:2 }}>
            <li>Open your Google Sheet → Extensions → Apps Script</li>
            <li>Replace the code with the provided <code>Code.gs</code> file</li>
            <li>Click Deploy → Manage Deployments → Edit → New Version → Deploy</li>
            <li>Copy the Web App URL and paste it above</li>
            <li>Click Save then Sync Now</li>
          </ol>
        </div>

        {/* Data info */}
        <div style={{ ...cardStyle, background:'#F0F7FF', borderLeft:'4px solid #2563EB' }}>
          <div style={{ fontWeight:700, fontSize:13, color:'#1D4ED8', marginBottom:6 }}>💾 Data Storage</div>
          <p style={{ fontSize:12, color:'var(--t2)', lineHeight:1.7, margin:0 }}>
            All data is saved in your browser's <strong>localStorage</strong> on this device. Use <strong>Sync Now</strong> to back it up to Google Sheets so you can access it from any device.
          </p>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// APP SHELL
// ═══════════════════════════════════════════════════════════════
const TABS = ['Day','Month','IP','Pharma','Staff','P&L','Trends','Export','Personal','Statement','Annual','Settings'];

function TabBar({ active, onTab, syncDot }) {
  const built=['Day','Month','IP','Pharma','Settings'];
  return (
    <div style={{display:'flex',alignItems:'stretch',background:'var(--g7)',paddingLeft:14,gap:2,flexShrink:0,width:'100%'}}>
      <div style={{display:'flex',alignItems:'center',gap:7,paddingRight:16,borderRight:'1px solid rgba(255,255,255,0.15)',marginRight:6}}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="10" y="2" width="4" height="20" rx="1.5" fill="white"/><rect x="2" y="10" width="20" height="4" rx="1.5" fill="white"/></svg>
        <span style={{color:'#fff',fontSize:12,fontWeight:700,letterSpacing:'0.3px'}}>VH Tracker</span>
      </div>
      {TABS.map(t=>{
        const isActive=t===active; const isBuilt=built.includes(t);
        return (
          <div key={t} onClick={()=>isBuilt&&onTab(t)}
            style={{padding:'9px 16px',fontSize:12,fontWeight:600,cursor:isBuilt?'pointer':'default',color:isActive?'var(--g7)':'rgba(255,255,255,0.65)',background:isActive?'var(--w)':'transparent',borderRadius:isActive?'6px 6px 0 0':0,marginTop:4,transition:'all 120ms',opacity:isBuilt?1:0.4,display:'flex',alignItems:'center',gap:5}}
            onMouseEnter={e=>{if(!isActive&&isBuilt)e.currentTarget.style.color='#fff';}}
            onMouseLeave={e=>{if(!isActive)e.currentTarget.style.color='rgba(255,255,255,0.65)';}}>
            {t}
            {t==='Settings'&&syncDot&&<span style={{width:7,height:7,borderRadius:'50%',background:syncDot,display:'inline-block',marginLeft:2}}/>}
          </div>
        );
      })}
    </div>
  );
}

function App() {
  const [tab,setTab]=useState(()=>{try{return localStorage.getItem('vh-tab')||'Day';}catch{return 'Day';}});
  const [date,setDate]=useState(()=>{try{return localStorage.getItem('vh-day-date')||today();}catch{return today();}});
  const [allData,setAllData]=useState(()=>{try{return JSON.parse(localStorage.getItem('vh-day-data')||'{}');}catch{return {};}});
  const [ipRecords,setIpRecords]=useState(()=>{try{return JSON.parse(localStorage.getItem('vh-ip-records')||'[]');}catch{return [];}});
  const [syncStatus,setSyncStatus]=useState(''); // 'ok' | 'err' | ''
  useEffect(()=>{try{localStorage.setItem('vh-tab',tab);}catch{}},[tab]);
  useEffect(()=>{try{localStorage.setItem('vh-day-date',date);}catch{}},[date]);
  const syncDot = syncStatus==='ok'?'#16A34A':syncStatus==='err'?'#D93025':null;
  return (
    <div style={{display:'flex',flexDirection:'column',height:'100vh',width:'100%',overflow:'hidden'}}>
      <TabBar active={tab} onTab={setTab} syncDot={syncDot}/>
      {tab==='Day'&&<DayView allData={allData} setAllData={setAllData} date={date} setDate={setDate}/>}
      {tab==='Month'&&<MonthView allData={allData} date={date} setDate={setDate} setTab={setTab}/>}
      {tab==='IP'&&<IpView ipRecords={ipRecords} setIpRecords={setIpRecords}/>}
      {tab==='Pharma'&&<PharmaView/>}
      {tab==='Settings'&&<SettingsView allData={allData} ipRecords={ipRecords} syncStatus={syncStatus} setSyncStatus={setSyncStatus}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
