<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── helpers ──────────────────────────────────────────────────
let _uid = 0;
const uid = () => `r${++_uid}_${Date.now()}`;
const n = v => { const x = parseFloat(String(v).replace(/,/g, '')); return isNaN(x) ? 0 : x; };
const calcTotal = r => n(r.opd) + n(r.xray) + n(r.popd) + n(r.pt) + n(r.lab) + n(r.medicals);
const inr = v => { const x = typeof v === 'number' ? v : n(v); return x === 0 ? '' : x.toLocaleString('en-IN'); };
const inrZ = v => { const x = typeof v === 'number' ? v : n(v); return '₹' + x.toLocaleString('en-IN'); };
const today = () => new Date().toISOString().slice(0, 10);
const offsetDate = (iso, d) => { const dt = new Date(iso + 'T00:00:00'); dt.setDate(dt.getDate() + d); return dt.toISOString().slice(0, 10); };
const fmtDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
const fmtDateShort = iso => { if(!iso) return '—'; const d = new Date(iso+'T00:00:00'); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; };
const makeRow = () => ({ id: uid(), mrn: '', name: '', type: 'N', opd: '', xray: '', popd: '', pt: '', lab: '', medicals: '', mode: 'Cash', cash: '', gpay: '' });
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ── Google Sheets Sync ───────────────────────────────────────
const GS_URL_KEY = 'vh-gs-url';
const GS_LAST_KEY = 'vh-gs-last';

function getGsUrl() { try { return localStorage.getItem(GS_URL_KEY)||''; } catch { return ''; } }
function setGsUrl(u) { try { localStorage.setItem(GS_URL_KEY, u); } catch {} }
function getGsLast() { try { return localStorage.getItem(GS_LAST_KEY)||''; } catch { return ''; } }
function setGsLast(t) { try { localStorage.setItem(GS_LAST_KEY, t); } catch {} }

async function syncToSheets(allData, ipRecords, url) {
  if (!url || !url.includes('script.google.com')) return { ok: false, msg: 'No URL' };
  try {
    const payload = { action: 'backup', payload: { allData, ipData: ipRecords } };
    const encoded = encodeURIComponent(JSON.stringify(payload));
    // Use GET with data as URL param — only way to avoid CORS body stripping
    const getUrl = url + '?data=' + encoded;
    await fetch(getUrl, { mode: 'no-cors' });
    const ts = new Date().toLocaleString('en-IN');
    setGsLast(ts);
    return { ok: true, msg: ts };
  } catch (e) {
    return { ok: false, msg: e.message || 'Network error' };
  }
}

const cellBase = { border:'none', outline:'none', background:'transparent', height:'100%', fontFamily:"'Noto Sans Mono',monospace", fontSize:12, color:'var(--t1)', display:'block' };

function Num({ val, onChange, onKeyDown, inputRef, readOnly }) {

    onKeyDown={onKeyDown} readOnly={readOnly} onFocus={()=>setFoc(true)} onBlur={()=>setFoc(false)}

function Txt({ val, onChange, onKeyDown, placeholder }) {

function Sel({ val, options, onChange, cfg }) {

function MonthYearNav({ year, month, onChange, children }) {
  const td = today(); const ty = parseInt(td.slice(0,4)); const tm = parseInt(td.slice(5,7))-1;
  const prev = () => month===0 ? onChange(year-1,11) : onChange(year,month-1);

  const btn = { border:'1px solid var(--bd2)', background:'var(--w)', borderRadius:6, padding:'4px 12px', cursor:'pointer', fontSize:12, fontWeight:600, color:'var(--t2)' };

const DAY_CLOSED_KEY='vh-day-closed';
function isDayClosed(date){try{const m=JSON.parse(localStorage.getItem(DAY_CLOSED_KEY)||'{}');return !!m[date];}catch{return false;}}
function setDayClosedState(date,closed){try{const m=JSON.parse(localStorage.getItem(DAY_CLOSED_KEY)||'{}');if(closed)m[date]=true;else delete m[date];localStorage.setItem(DAY_CLOSED_KEY,JSON.stringify(m));}catch{}}

function buildDayReport(date,rows){
  const stats=getDayStats(rows)||{cash:0,gpay:0,total:0,med:0,opd_rev:0,xray:0,popd:0,pt:0,lab:0,xpl:0,pts:0,N:0,O:0,OGN:0,OGO:0};
  const op=rows.reduce((s,r)=>s+n(r.opd),0);
  const popd=rows.reduce((s,r)=>s+n(r.popd),0);
  const opdTile=op+popd;
  const xray=rows.reduce((s,r)=>s+n(r.xray),0);
  const pt=rows.reduce((s,r)=>s+n(r.pt),0);
  const lab=rows.reduce((s,r)=>s+n(r.lab),0);
  const xpl=xray+pt+lab;
  const med=rows.reduce((s,r)=>s+n(r.medicals),0);
  const total=rows.reduce((s,r)=>s+calcTotal(r),0);
  const cash=rows.reduce((s,r)=>s+n(r.cash),0);
  const gpay=rows.reduce((s,r)=>s+n(r.gpay),0);
  const d=new Date(date+'T00:00:00');
  const dStr=d.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  const fmt=v=>v.toLocaleString('en-IN');
  const lines=[];
  lines.push(`*VH Hospital — Day Report*`);
  lines.push(`${dStr}`);
  lines.push('');
  lines.push(`*Patients:* ${stats.pts}  (N:${stats.N} O:${stats.O} OG-N:${stats.OGN} OG-O:${stats.OGO})`);
  lines.push('');
  lines.push(`*Revenue Breakdown*`);
  lines.push(`OPD : ₹${fmt(opdTile)}  (OP:₹${fmt(op)}, PD:₹${fmt(popd)})`);
  lines.push(`XPL : ₹${fmt(xpl)}  (X:₹${fmt(xray)}, PT:₹${fmt(pt)}, L:₹${fmt(lab)})`);
  lines.push(`Medicals: ₹${fmt(med)}`);
  lines.push(`-------------------------`);
  lines.push(`*Total Revenue: ₹${fmt(total)}*`);
  lines.push('');
  lines.push(`*Collection*`);
  lines.push(`Cash : ₹${fmt(cash)}`);
  lines.push(`GPay : ₹${fmt(gpay)}`);
  const collected=cash+gpay;
  lines.push(`Total: ₹${fmt(collected)}`);
  if(Math.abs(collected-total)>=1)lines.push(`⚠ Off by ₹${fmt(Math.abs(collected-total))}`);
  else lines.push(`✓ Balanced`);
  return lines.join('\n');
}

function downloadCsv(date,rows){
  const head=['#','MRN','Name','Type','OPD','X-Ray','POP-D','PT','Lab','Medicals','Total','Mode','Cash','GPay'];
  const lines=[head.join(',')];
  rows.forEach((r,i)=>{
    const row=[i+1,r.mrn||'',`"${(r.name||'').replace(/"/g,'""')}"`,r.type||'',n(r.opd),n(r.xray),n(r.popd),n(r.pt),n(r.lab),n(r.medicals),calcTotal(r),r.mode||'',n(r.cash),n(r.gpay)];
    lines.push(row.join(','));
  });
  const blob=new Blob([lines.join('\n')],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`VH-Day-${date}.csv`;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function DayView({ allData, setAllData, date, setDate }) {
  const rows=(allData[date]&&allData[date].length>0)?allData[date]:[makeRow()];
  const [closed,setClosed]=useState(()=>isDayClosed(date));
  useEffect(()=>{setClosed(isDayClosed(date));},[date]);
  function setRows(nr){const up={...allData,[date]:nr};setAllData(up);try{localStorage.setItem('vh-day-data',JSON.stringify(up));}catch{}}
  function updateRow(id,field,value){
    if(closed)return;
    setRows(rows.map(r=>{
      if(r.id!==id) return r;
      const up={...r,[field]:value};
      const rev=['opd','xray','popd','pt','lab','medicals'];
      if(rev.includes(field)||field==='mode'){const t=calcTotal(up);if(up.mode==='Cash'){up.cash=t>0?inr(t):'';up.gpay='';}else if(up.mode==='GPay'){up.gpay=t>0?inr(t):'';up.cash='';}}
      return up;
    }));
  }
  function handleClose(){
    const stats=getDayStats(rows);
    const total=rows.reduce((s,r)=>s+calcTotal(r),0);
    const collected=rows.reduce((s,r)=>s+n(r.cash)+n(r.gpay),0);
    const off=Math.abs(total-collected);
    let msg=`Close day for ${date}?\n\nPatients: ${stats?stats.pts:0}\nTotal: ₹${total.toLocaleString('en-IN')}\nCollected: ₹${collected.toLocaleString('en-IN')}`;
    if(off>=1)msg+=`\n⚠ Reconciliation off by ₹${off.toLocaleString('en-IN')}`;
    msg+='\n\nAfter closing, you can still add late patients but cannot edit existing rows.';
    if(!confirm(msg))return;
    setDayClosedState(date,true);setClosed(true);
  }
  function handleReopen(){
    if(!confirm('Reopen this day? You will be able to edit all rows again.'))return;
    setDayClosedState(date,false);setClosed(false);
  }
  function handleAdd(){setRows([...rows,makeRow()]);}
  function handleAddLate(){
    // allow adding even when closed
    setRows([...rows,makeRow()]);
  }
  return (
    <>
      <DateNav date={date} onChange={setDate}/>
      <DayActionBar date={date} rows={rows} closed={closed}
        onClose={handleClose} onReopen={handleReopen}
        onAdd={handleAdd} onAddLate={handleAddLate}/>
      <PatientTable rows={rows} closed={closed} onUpdate={updateRow}
        onDelete={id=>{if(closed)return;const nr=rows.filter(r=>r.id!==id);setRows(nr.length?nr:[makeRow()]);}}
        onAdd={handleAdd}/>
      <DayKpis rows={rows}/>
    </>
  );
}

function getDayStats(rows){
  if(!rows||!rows.length) return null;
  const s={cash:0,gpay:0,total:0,med:0,opd_rev:0,opd:0,pt:0,lab:0,xray:0,popd:0,xpl:0,pts:0,N:0,O:0,OGN:0,OGO:0};
  rows.forEach(r=>{s.cash+=n(r.cash);s.gpay+=n(r.gpay);const t=calcTotal(r);s.total+=t;s.med+=n(r.medicals);s.opd+=n(r.opd);s.pt+=n(r.pt);s.lab+=n(r.lab);s.xray+=n(r.xray);s.popd+=n(r.popd);if(r.type==='N'){s.N++;s.pts++;}else if(r.type==='O'){s.O++;s.pts++;}else if(r.type==='OG-N'){s.OGN++;s.pts++;}else if(r.type==='OG-O'){s.OGO++;s.pts++;}});
  s.opd_rev=s.opd+s.popd; s.xpl=s.xray+s.pt+s.lab;
  return s;
}

function IpView({ ipRecords, setIpRecords }) {
  const td=today(); const ty=parseInt(td.slice(0,4)); const tm=parseInt(td.slice(5,7))-1;
  const [year,setYear]=useState(ty); const [month,setMonth]=useState(tm);
  const records = ipRecords;
  const [modal,setModal]=useState(null);

  function saveRecords(r){setIpRecords(r);try{localStorage.setItem('vh-ip-records',JSON.stringify(r));}catch{}}

  const monthStr=`${year}-${String(month+1).padStart(2,'0')}`;
  const filtered=records.filter(r=>r.admitDate&&r.admitDate.startsWith(monthStr));

  function handleSave(form){
    if(modal==='new'){saveRecords([...records,{...form,id:form.id||uid()}]);}
    else{saveRecords(records.map(r=>r.id===form.id?form:r));}
    setModal(null);
  }
  function handleDelete(id){if(confirm('Delete this patient record?'))saveRecords(records.filter(r=>r.id!==id));}

  // KPI tiles
  const totBill=filtered.reduce((s,r)=>s+n(r.bill),0);
  const totMed=filtered.reduce((s,r)=>s+n(r.medicines),0);
  const admitted=filtered.filter(r=>r.status==='Admitted').length;

  const lama=filtered.filter(r=>r.status==='LAMA').length;

      <div style={{fontSize:20,fontWeight:700,fontFamily:"'Noto Sans Mono',monospace",color:color||'var(--t1)',lineHeight:1.2,marginTop:3}}>{value}</div>
    </div>
  );

  return (
    <>
      <MonthYearNav year={year} month={month} onChange={(y,m)=>{setYear(y);setMonth(m);}}>
        <button onClick={()=>setModal('new')} style={{background:'var(--g7)',color:'#fff',border:'none',borderRadius:7,padding:'6px 14px',cursor:'pointer',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',gap:5}}>
          <span style={{fontSize:16,lineHeight:1}}>+</span> Admit Patient
        </button>
      </MonthYearNav>
      {/* KPI row */}
      <div style={{background:'var(--bg)',borderBottom:'1px solid var(--bd)',padding:'8px 12px',display:'flex',gap:8,flexShrink:0,width:'100%'}}>
        <T label="Total Patients" value={filtered.length}/>

        <T label="Discharged" value={discharged} color="var(--grntx)" bg="var(--grnbg)"/>

        <T label="Medicines ₹" value={inrZ(totMed)} color="#6B21A8" bg="#F3E8FF"/>

const PHARMA_KEY='vh-pharma-data';
const PHARMA_AGENCIES_KEY='vh-pharma-agencies';
const DEFAULT_AGENCIES=['Senthil','Karthikeya','NH Surgical','HR Surgical','Lakshmi','Geetha Dharmapuri','Thamaraikani','Senthil Balaji','Kumaran','Saravana','Cylinder','Geetha Salem','Sara','Dhanalakshmi','Senthil Murugan','Vishnu','Universal','Lifeline','Aanand','Latha','Salem','Jayshree','Ramesh G','Rathna','Bioremedies','Dharmapuri','Sunshine','Sri Balaji'];

function PharmaView(){
  const td=today(); const ty=parseInt(td.slice(0,4)); const tm=parseInt(td.slice(5,7))-1;
  const [year,setYear]=useState(ty); const [month,setMonth]=useState(tm);
  const [entries,setEntries]=useState(()=>{try{return JSON.parse(localStorage.getItem(PHARMA_KEY)||'[]');}catch{return [];}});
  const [agencies,setAgencies]=useState(()=>{
    try{
      const s=localStorage.getItem(PHARMA_AGENCIES_KEY);
      if(s===null){try{localStorage.setItem(PHARMA_AGENCIES_KEY,JSON.stringify(DEFAULT_AGENCIES));}catch{}return DEFAULT_AGENCIES;}
      const p=JSON.parse(s);
      if(Array.isArray(p)&&p.length>0)return p;
      try{localStorage.setItem(PHARMA_AGENCIES_KEY,JSON.stringify(DEFAULT_AGENCIES));}catch{}return DEFAULT_AGENCIES;
    }catch{return DEFAULT_AGENCIES;}
  });
  const [newAgency,setNewAgency]=useState('');

  function saveEntries(e){setEntries(e);try{localStorage.setItem(PHARMA_KEY,JSON.stringify(e));}catch{}}
  function saveAgencies(a){setAgencies(a);try{localStorage.setItem(PHARMA_AGENCIES_KEY,JSON.stringify(a));}catch{}}

  const monthStr=`${year}-${String(month+1).padStart(2,'0')}`;
  const monthEntries=entries.filter(e=>e.date&&e.date.startsWith(monthStr));

  // All agencies = managed list ∪ agencies seen in entries
  const allAgencyNames=[...new Set([...agencies,...entries.map(e=>e.agency).filter(Boolean)])].sort();

  function addAgency(){
    const name=newAgency.trim();
    if(!name){return;}
    if(agencies.includes(name)){setNewAgency('');return;}
    saveAgencies([...agencies,name]);
    setNewAgency('');
  }

  function addEntry(agency,date,amount,paid,mode){
    if(!date||!amount||n(amount)<=0){alert('Date and amount required');return;}
    if(!agencies.includes(agency))saveAgencies([...agencies,agency]);
    saveEntries([...entries,{id:uid(),date,agency,amount:n(amount),paid:n(paid),mode}]);
  }

  function deleteEntry(id){if(confirm('Delete this entry?'))saveEntries(entries.filter(e=>e.id!==id));}

  function bulkPayMonth(agency){
    // Mark every entry in CURRENT month for this agency as fully paid
    saveEntries(entries.map(e=>{
      if(e.agency!==agency) return e;
      if(!e.date||!e.date.startsWith(monthStr)) return e;
      return {...e,paid:n(e.amount)};
    }));
  }

  function bulkSetPaid(agency,total){
    // Distribute oldest-first across this agency's entries (all months, oldest first)
    const t=n(total);
    if(t<0){alert('Invalid amount');return;}
    const agencyEntries=entries.filter(e=>e.agency===agency).sort((a,b)=>a.date.localeCompare(b.date));
    let remaining=t;
    const updated=new Map();
    for(const e of agencyEntries){
      const can=Math.min(remaining,e.amount);
      updated.set(e.id,can);
      remaining-=can;
      if(remaining<=0)break;
    }
    saveEntries(entries.map(e=>e.agency===agency?{...e,paid:updated.has(e.id)?updated.get(e.id):0}:e));
  }

  // Month totals
  const totAmt=monthEntries.reduce((s,e)=>s+n(e.amount),0);
  const totPaid=monthEntries.reduce((s,e)=>s+n(e.paid),0);
  const totDue=totAmt-totPaid;

  return (
    <>
      <MonthYearNav year={year} month={month} onChange={(y,m)=>{setYear(y);setMonth(m);}}>
        <div style={{display:'flex',alignItems:'center',gap:14,fontSize:12}}>
          <span style={{color:'var(--t2)'}}>Total: <b style={{color:'var(--t1)',fontFamily:"'Noto Sans Mono',monospace"}}>{inrZ(totAmt)}</b></span>
          <span style={{color:'var(--t2)'}}>Paid: <b style={{color:'var(--grntx)',fontFamily:"'Noto Sans Mono',monospace"}}>{inrZ(totPaid)}</b></span>
          <span style={{color:'var(--t2)'}}>Due: <b style={{color:'var(--redtx)',fontFamily:"'Noto Sans Mono',monospace"}}>{inrZ(totDue)}</b></span>
        </div>
      </MonthYearNav>

      {/* Add agency row */}
      <div style={{background:'var(--bg)',borderBottom:'1px solid var(--bd)',padding:'8px 12px',display:'flex',gap:8,alignItems:'center',flexShrink:0}}>
        <input value={newAgency} onChange={e=>setNewAgency(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')addAgency();}} placeholder="New agency name"
          style={{flex:'0 0 240px',border:'1px solid var(--bd2)',borderRadius:7,padding:'7px 10px',fontSize:12,background:'var(--w)',outline:'none'}}/>
        <button onClick={addAgency} style={{background:'var(--g7)',color:'#fff',border:'none',borderRadius:7,padding:'7px 14px',cursor:'pointer',fontSize:12,fontWeight:700}}>+ Add Agency</button>
        <span style={{color:'var(--t3)',fontSize:11,marginLeft:8}}>{allAgencyNames.length} agencies</span>
      </div>

      {/* Cards grid */}
      <div style={{flex:1,overflowY:'auto',background:'var(--bg)',padding:12}}>
        {allAgencyNames.length===0 ? (
          <div style={{textAlign:'center',color:'var(--t3)',padding:'40px 0',fontSize:13}}>No agencies yet. Add one above to get started.</div>
        ) : (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:10}}>
            {allAgencyNames.map(ag=><AgencyCard key={ag} agency={ag} monthStr={monthStr} monthEntries={monthEntries.filter(e=>e.agency===ag)} allEntries={entries.filter(e=>e.agency===ag)} onAdd={(d,a,p,m)=>addEntry(ag,d,a,p,m)} onDelete={deleteEntry} onBulkPaid={t=>bulkSetPaid(ag,t)} onPayAll={()=>bulkPayMonth(ag)}/>)}
          </div>
        )}
      </div>
    </>
  );
}

function AgencyCard({ agency, monthStr, monthEntries, allEntries, onAdd, onDelete, onBulkPaid, onPayAll }){
  const [date,setDate]=useState(today());
  const [amount,setAmount]=useState('');
  const [mode,setMode]=useState('Cash');
  const [editingPaid,setEditingPaid]=useState(false);
  const [paidDraft,setPaidDraft]=useState('');

  const totAmt=monthEntries.reduce((s,e)=>s+n(e.amount),0);
  const totPaid=monthEntries.reduce((s,e)=>s+n(e.paid),0);
  const due=totAmt-totPaid;
  const fullyPaid=totAmt>0&&due<=0;

  function submit(){
    onAdd(date,amount,0,mode);
    setAmount('');
  }

  function savePaid(){
    onBulkPaid(paidDraft);
    setEditingPaid(false);
  }

  function payAll(){
    if(totAmt<=0){alert('No entries to pay this month.');return;}
    if(due<=0){alert('Already fully paid.');return;}
    if(!confirm(`Pay all ${monthEntries.length} entries for ${agency} this month?\n\nTotal: ₹${totAmt.toLocaleString('en-IN')}\nAlready paid: ₹${totPaid.toLocaleString('en-IN')}\nWill mark paid: ₹${due.toLocaleString('en-IN')}`))return;
    onPayAll();
  }

  return (
    <div style={{background:'var(--w)',border:'1px solid var(--bd)',borderRadius:8,padding:12,display:'flex',flexDirection:'column',gap:8,borderLeft:`3px solid ${fullyPaid?'var(--grntx)':due>0?'var(--redtx)':'var(--bd2)'}`}}>
      {/* Header */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:6}}>
        <div style={{minWidth:0,flex:1}}>
          <div style={{fontWeight:700,fontSize:13,color:'var(--t1)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{agency}</div>
          <div style={{fontSize:10,color:'var(--t3)',marginTop:1}}>Total <b style={{color:'var(--t1)',fontFamily:"'Noto Sans Mono',monospace"}}>{inrZ(totAmt)}</b></div>
        </div>
        <div style={{textAlign:'right',fontSize:10,minWidth:84}}>
          {editingPaid ? (
            <div style={{display:'flex',gap:3,alignItems:'center'}}>
              <input type="number" value={paidDraft} onChange={e=>setPaidDraft(e.target.value)} autoFocus
                style={{width:60,border:'1px solid var(--bd2)',borderRadius:4,padding:'2px 4px',fontSize:11,fontFamily:"'Noto Sans Mono',monospace",textAlign:'right'}}/>
              <button onClick={savePaid} style={{background:'var(--g7)',color:'#fff',border:'none',borderRadius:4,padding:'2px 6px',fontSize:10,cursor:'pointer'}}>✓</button>
              <button onClick={()=>setEditingPaid(false)} style={{background:'var(--w)',border:'1px solid var(--bd2)',borderRadius:4,padding:'2px 6px',fontSize:10,cursor:'pointer'}}>×</button>
            </div>
          ) : (
            <>
              <div>Paid <b style={{color:'var(--grntx)',fontFamily:"'Noto Sans Mono',monospace"}}>{inrZ(totPaid)}</b> <span onClick={()=>{setPaidDraft(String(totPaid));setEditingPaid(true);}} style={{cursor:'pointer',color:'var(--t3)',marginLeft:2}} title="Set custom paid amount (FIFO)">✎</span></div>
              {due>0&&<div style={{color:'var(--redtx)',fontWeight:700,marginTop:2}}>Due <span style={{fontFamily:"'Noto Sans Mono',monospace"}}>{inrZ(due)}</span></div>}
              {fullyPaid&&<div style={{color:'var(--grntx)',fontWeight:700,marginTop:2}}>✓ Cleared</div>}
            </>
          )}
        </div>
      </div>

      {/* Pay All button */}
      <button onClick={payAll} disabled={due<=0}
        style={{background:due>0?'var(--grntx)':'var(--g0)',color:due>0?'#fff':'var(--t3)',border:due>0?'none':'1px solid var(--bd)',borderRadius:6,padding:'7px 0',fontSize:12,fontWeight:700,cursor:due>0?'pointer':'not-allowed'}}>
        {fullyPaid?'✓ Fully Paid':due>0?`Pay All — ₹${due.toLocaleString('en-IN')}`:'No entries'}
      </button>

      {/* Entries list */}
      <div style={{borderTop:'1px solid var(--bd)',paddingTop:6,minHeight:24}}>
        {monthEntries.length===0 ? (
          <div style={{textAlign:'center',color:'var(--dis)',fontSize:11,padding:'4px 0'}}>No entries this month</div>
        ) : (
          monthEntries.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{
            const eDue=n(e.amount)-n(e.paid);
            return (
              <div key={e.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:11,padding:'2px 0',gap:6}}>
                <span style={{color:'var(--t3)',whiteSpace:'nowrap'}}>{fmtDateShort(e.date).slice(0,5)} · {e.mode==='Bank Transfer'?'BT':'Cash'}</span>
                <span style={{display:'flex',alignItems:'center',gap:6,fontFamily:"'Noto Sans Mono',monospace"}}>
                  <span style={{color:eDue>0?'var(--redtx)':'var(--t1)'}}>{inrZ(e.amount)}</span>
                  {n(e.paid)>0&&<span style={{color:'var(--grntx)',fontSize:10}}>p {inrZ(e.paid)}</span>}
                  <span onClick={()=>onDelete(e.id)} style={{cursor:'pointer',color:'var(--red)',fontSize:13,lineHeight:1}}>×</span>
                </span>
              </div>
            );
          })
        )}
      </div>

      {/* Add row */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 80px 60px 28px',gap:4,alignItems:'center'}}>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)}
          style={{border:'1px solid var(--bd2)',borderRadius:5,padding:'5px 6px',fontSize:11,minWidth:0}}/>
        <input type="number" placeholder="Amount" value={amount} onChange={e=>setAmount(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&amount)submit();}}
          style={{border:'1px solid var(--bd2)',borderRadius:5,padding:'5px 6px',fontSize:11,fontFamily:"'Noto Sans Mono',monospace",textAlign:'right',minWidth:0}}/>
        <select value={mode} onChange={e=>setMode(e.target.value)}
          style={{border:'1px solid var(--bd2)',borderRadius:5,padding:'5px 4px',fontSize:11,minWidth:0,background:'var(--w)'}}>
          <option value="Cash">Cash</option>
          <option value="Bank Transfer">BT</option>
        </select>
        <button onClick={submit} disabled={!amount} style={{background:amount?'var(--g6)':'var(--dis)',color:'#fff',border:'none',borderRadius:5,padding:'5px 0',cursor:amount?'pointer':'not-allowed',fontSize:14,fontWeight:700,lineHeight:1}}>+</button>
      </div>
    </div>
  );
}

const STAFF_KEY='vh-staff-data';
const STAFF_PAID_KEY='vh-staff-paid';
const DEFAULT_STAFF_RAW=[['Bathroom',3000],['Chinnarasu',14000],['Flower & Milk',2400],['Housekeeping night',9000],['Iyer',5000],['Jayaprabhu',19000],['Kaja',8000],['Kanimozhi',11000],['Karthik',9000],['Kesavan',17000],['Parvathi',8500],['Rekha',8000],['Salammal',8500],['Sylvi',8000],['Balaji',14500]];
function buildDefaultStaff(){const t=today();const m=t.slice(0,7);return DEFAULT_STAFF_RAW.map(([name,sal])=>({id:uid(),name,joinDate:t,salaryHistory:[{effectiveMonth:m,amount:sal}]}));}

// Get salary effective for a given month (YYYY-MM) by walking salaryHistory
function salaryFor(staff,monthStr){
  if(!staff.salaryHistory||staff.salaryHistory.length===0)return 0;
  const sorted=[...staff.salaryHistory].sort((a,b)=>a.effectiveMonth.localeCompare(b.effectiveMonth));
  let cur=0;
  for(const h of sorted){
    if(h.effectiveMonth<=monthStr)cur=n(h.amount);
    else break;
  }
  return cur;
}

// Months between two YYYY-MM strings
function monthsBetween(fromYM,toYM){
  if(!fromYM||!toYM)return 0;
  const [fy,fm]=fromYM.split('-').map(Number);
  const [ty,tm]=toYM.split('-').map(Number);
  return (ty-fy)*12+(tm-fm);
}

function StaffView(){
  const td=today(); const ty=parseInt(td.slice(0,4)); const tm=parseInt(td.slice(5,7))-1;
  const [year,setYear]=useState(ty); const [month,setMonth]=useState(tm);
  const [staff,setStaff]=useState(()=>{
    try{
      const s=localStorage.getItem(STAFF_KEY);
      if(s===null){const seed=buildDefaultStaff();try{localStorage.setItem(STAFF_KEY,JSON.stringify(seed));}catch{}return seed;}
      const p=JSON.parse(s);
      if(Array.isArray(p)&&p.length>0)return p;
      const seed=buildDefaultStaff();try{localStorage.setItem(STAFF_KEY,JSON.stringify(seed));}catch{}return seed;
    }catch{const seed=buildDefaultStaff();try{localStorage.setItem(STAFF_KEY,JSON.stringify(seed));}catch{}return seed;}
  });
  const [paidMap,setPaidMap]=useState(()=>{try{return JSON.parse(localStorage.getItem(STAFF_PAID_KEY)||'{}');}catch{return {};}});
  const [newName,setNewName]=useState('');
  const [newSalary,setNewSalary]=useState('');
  const [newJoin,setNewJoin]=useState(today());

  function saveStaff(s){setStaff(s);try{localStorage.setItem(STAFF_KEY,JSON.stringify(s));}catch{}}
  function savePaid(p){setPaidMap(p);try{localStorage.setItem(STAFF_PAID_KEY,JSON.stringify(p));}catch{}}

  const monthStr=`${year}-${String(month+1).padStart(2,'0')}`;
  const monthPaid=paidMap[monthStr]||{};

  function addStaff(){
    const name=newName.trim();
    if(!name||!newSalary||n(newSalary)<=0){alert('Name and salary required');return;}
    const joinMonth=(newJoin||today()).slice(0,7);
    saveStaff([...staff,{
      id:uid(), name, joinDate:newJoin||today(),
      salaryHistory:[{effectiveMonth:joinMonth,amount:n(newSalary)}]
    }]);
    setNewName(''); setNewSalary(''); setNewJoin(today());
  }

  function deleteStaff(id){
    if(!confirm('Delete this staff member? Past payment records remain.'))return;
    saveStaff(staff.filter(s=>s.id!==id));
  }

  function updateSalary(id,newAmount){
    const amt=n(newAmount);
    if(amt<=0)return;
    saveStaff(staff.map(s=>{
      if(s.id!==id)return s;
      const hist=[...(s.salaryHistory||[])];
      const existing=hist.findIndex(h=>h.effectiveMonth===monthStr);
      if(existing>=0)hist[existing]={effectiveMonth:monthStr,amount:amt};
      else hist.push({effectiveMonth:monthStr,amount:amt});
      return {...s,salaryHistory:hist};
    }));
  }

  function updateJoinDate(id,newDate){
    if(!newDate)return;
    saveStaff(staff.map(s=>{
      if(s.id!==id)return s;
      const newMonth=newDate.slice(0,7);
      const hist=[...(s.salaryHistory||[])].sort((a,b)=>a.effectiveMonth.localeCompare(b.effectiveMonth));
      if(hist.length>0)hist[0]={...hist[0],effectiveMonth:newMonth};
      return {...s,joinDate:newDate,salaryHistory:hist};
    }));
  }

  function togglePaid(id){
    const next={...paidMap,[monthStr]:{...monthPaid,[id]:!monthPaid[id]}};
    savePaid(next);
  }

  // Hike check: 12+ months since last salary change OR join date
  function lastChangeMonth(s){
    if(!s.salaryHistory||s.salaryHistory.length===0)return s.joinDate?s.joinDate.slice(0,7):'';
    return [...s.salaryHistory].sort((a,b)=>b.effectiveMonth.localeCompare(a.effectiveMonth))[0].effectiveMonth;
  }
  function needsHike(s){
    const last=lastChangeMonth(s);
    return monthsBetween(last,monthStr)>=12;
  }
  const hikeList=staff.filter(needsHike);

  // Totals (for current viewing month)
  const rows=staff.map(s=>({...s,salary:salaryFor(s,monthStr),paid:!!monthPaid[s.id]}));
  const totMonthly=rows.reduce((sum,r)=>sum+r.salary,0);
  const totPaid=rows.filter(r=>r.paid).reduce((sum,r)=>sum+r.salary,0);
  const totPending=totMonthly-totPaid;
  const paidCount=rows.filter(r=>r.paid).length;
  const totAnnual=totMonthly*12;

  const T=({label,value,sub,color,bg})=>(
    <div style={{background:bg||'var(--w)',border:`1px solid ${color||'var(--bd)'}`,borderRadius:7,padding:'8px 14px',flex:'1 1 0',minWidth:0}}>
      <div style={{fontSize:9,fontWeight:700,color:color||'var(--t3)',textTransform:'uppercase',letterSpacing:'0.7px',whiteSpace:'nowrap'}}>{label}</div>
      <div style={{fontSize:20,fontWeight:700,fontFamily:"'Noto Sans Mono',monospace",color:color||'var(--t1)',lineHeight:1.2,marginTop:3}}>{value}</div>
      {sub&&<div style={{fontSize:10,color:color||'var(--t3)',marginTop:2}}>{sub}</div>}
    </div>
  );

  return (
    <>
      <MonthYearNav year={year} month={month} onChange={(y,m)=>{setYear(y);setMonth(m);}}/>

      {/* KPI tiles */}
      <div style={{background:'var(--bg)',borderBottom:'1px solid var(--bd)',padding:'8px 12px',display:'flex',gap:8,flexShrink:0,width:'100%'}}>
        <T label="Total Monthly" value={inrZ(totMonthly)} sub={`${staff.length} staff`} color="var(--ambtx)" bg="var(--ambbg)"/>
        <T label="Paid This Month" value={inrZ(totPaid)} sub={`${paidCount} paid`} color="var(--grntx)" bg="var(--grnbg)"/>
        <T label="Pending" value={inrZ(totPending)} sub={`${staff.length-paidCount} unpaid`} color="var(--redtx)" bg="var(--redbg)"/>
        <T label="Annual Cost" value={inrZ(totAnnual)} color="var(--blutx)" bg="var(--blubg)"/>
      </div>

      {/* Hike banner */}
      {hikeList.length>0&&(
        <div style={{background:'var(--ambbg)',borderBottom:'1px solid var(--amb)',padding:'8px 14px',fontSize:12,color:'var(--ambtx)',flexShrink:0}}>
          <b>⚠ {hikeList.length} staff due for salary hike review</b> — {hikeList.map(s=>s.name).join(', ')}
        </div>
      )}

      {/* Add staff */}
      <div style={{background:'var(--w)',borderBottom:'1px solid var(--bd)',padding:'10px 14px',display:'flex',gap:8,alignItems:'center',flexShrink:0}}>
        <span style={{fontSize:10,fontWeight:700,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'0.7px',marginRight:4}}>Add</span>
        <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Staff name"
          style={{flex:'1 1 200px',border:'1px solid var(--bd2)',borderRadius:7,padding:'7px 10px',fontSize:12,background:'var(--w)',outline:'none'}}/>
        <input type="number" value={newSalary} onChange={e=>setNewSalary(e.target.value)} placeholder="Monthly ₹"
          style={{flex:'0 0 120px',border:'1px solid var(--bd2)',borderRadius:7,padding:'7px 10px',fontSize:12,fontFamily:"'Noto Sans Mono',monospace",textAlign:'right',outline:'none'}}/>
        <input type="date" value={newJoin} onChange={e=>setNewJoin(e.target.value)} title="Join date"
          style={{flex:'0 0 130px',border:'1px solid var(--bd2)',borderRadius:7,padding:'7px 10px',fontSize:12,outline:'none'}}/>
        <button onClick={addStaff} style={{background:'var(--g7)',color:'#fff',border:'none',borderRadius:7,padding:'7px 16px',cursor:'pointer',fontSize:12,fontWeight:700,whiteSpace:'nowrap'}}>+ Add</button>
      </div>

      {/* Table */}
      <div style={{flex:1,overflowY:'auto',background:'var(--bg)',padding:12}}>
        <div style={{background:'var(--w)',border:'1px solid var(--bd)',borderRadius:8,overflow:'hidden'}}>
          <div style={{background:'var(--g7)',color:'#fff',padding:'9px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:12,fontWeight:700}}>
            <span>Staff Salary Register — {MONTHS_LONG[month]} {year}</span>
            <span style={{fontFamily:"'Noto Sans Mono',monospace",fontWeight:500,fontSize:11}}>
              Paid {inrZ(totPaid)} / {inrZ(totMonthly)} · Pending {inrZ(totPending)}
            </span>
          </div>
          {staff.length===0 ? (
            <div style={{textAlign:'center',color:'var(--t3)',padding:40,fontSize:13}}>No staff yet. Add one above.</div>
          ) : (
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead>
                <tr style={{background:'var(--g0)',borderBottom:'1px solid var(--bd)'}}>
                  <th style={{padding:'7px 10px',textAlign:'left',width:30,color:'var(--t3)',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px'}}>#</th>
                  <th style={{padding:'7px 10px',textAlign:'left',color:'var(--t3)',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px'}}>Name</th>
                  <th style={{padding:'7px 10px',textAlign:'left',width:90,color:'var(--t3)',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px'}}>Joined</th>
                  <th style={{padding:'7px 10px',textAlign:'right',width:120,color:'var(--t3)',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px'}}>Monthly ₹</th>
                  <th style={{padding:'7px 10px',textAlign:'right',width:110,color:'var(--t3)',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px'}}>Annual ₹</th>
                  <th style={{padding:'7px 10px',textAlign:'center',width:90,color:'var(--t3)',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px'}}>Paid?</th>
                  <th style={{padding:'7px 10px',width:34}}></th>
                </tr>
              </thead>
              <tbody>
                {rows.sort((a,b)=>a.name.localeCompare(b.name)).map((r,i)=>{
                  const hike=needsHike(r);
                  const joinShort=r.joinDate?(()=>{const d=new Date(r.joinDate+'T00:00:00');return `${MONTHS_LONG[d.getMonth()].slice(0,3)} '${String(d.getFullYear()).slice(2)}`;})():'—';
                  return (
                    <tr key={r.id} style={{borderBottom:'1px solid var(--bd)'}}>
                      <td style={{padding:'7px 10px',color:'var(--t3)'}}>{i+1}</td>
                      <td style={{padding:'7px 10px',fontWeight:600,color:'var(--t1)'}}>
                        {r.name}
                        {hike&&<span style={{background:'var(--ambbg)',color:'var(--ambtx)',fontSize:9,padding:'1px 6px',borderRadius:3,marginLeft:6,fontWeight:700,letterSpacing:'0.3px'}}>HIKE?</span>}
                      </td>
                      <td style={{padding:'4px 8px',color:'var(--t3)',fontSize:11}}>
                        <input type="date" defaultValue={r.joinDate||''} onBlur={e=>{if(e.target.value&&e.target.value!==r.joinDate)updateJoinDate(r.id,e.target.value);}}
                          style={{border:'1px solid var(--bd2)',borderRadius:5,padding:'4px 6px',fontSize:11,fontFamily:"'Noto Sans Mono',monospace",outline:'none',color:'var(--t2)',background:'var(--w)',width:'100%',minWidth:0}} title={`Joined: ${joinShort}`}/>
                      </td>
                      <td style={{padding:'4px 10px',textAlign:'right'}}>
                        <input type="number" defaultValue={r.salary} onBlur={e=>{if(n(e.target.value)!==r.salary)updateSalary(r.id,e.target.value);}}
                          style={{width:'100%',border:'1px solid var(--bd2)',borderRadius:5,padding:'5px 8px',fontSize:12,fontFamily:"'Noto Sans Mono',monospace",textAlign:'right',outline:'none'}}/>
                      </td>
                      <td style={{padding:'7px 10px',textAlign:'right',fontFamily:"'Noto Sans Mono',monospace",color:'var(--t1)'}}>{inrZ(r.salary*12)}</td>
                      <td style={{padding:'7px 10px',textAlign:'center'}}>
                        <span onClick={()=>togglePaid(r.id)}
                          style={{display:'inline-block',background:r.paid?'var(--grnbg)':'var(--redbg)',color:r.paid?'var(--grntx)':'var(--redtx)',fontSize:11,fontWeight:600,padding:'3px 12px',borderRadius:12,cursor:'pointer',userSelect:'none',minWidth:70}}>
                          {r.paid?'● Paid':'○ Unpaid'}
                        </span>
                      </td>
                      <td style={{padding:'7px 10px',textAlign:'center'}}>
                        <span onClick={()=>deleteStaff(r.id)} style={{cursor:'pointer',color:'var(--red)',fontSize:14}}>🗑</span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </>
  );
}

// ═══════════════════════════════════════════════════════════════
// P&L TAB (Cash basis)
// ═══════════════════════════════════════════════════════════════
const PNL_KEY='vh-pnl-manual';
const PNL_CATS=[
  {key:'pharmaSales',label:'Pharma sales (manual top-up)',type:'income'},
  {key:'rent',label:'Rent',type:'expense'},
  {key:'utilities',label:'Utilities',type:'expense'},
  {key:'internet',label:'Internet',type:'expense'},
  {key:'electricity',label:'Electricity',type:'expense'},
  {key:'other',label:'Other',type:'expense'}
];

// Migrate old shape {pharmaSales: 1000} -> {pharmaSales: [{id, date, desc:'Migrated', amount:1000}]}
function migratePnlMonth(rec,monthStr){
  const out={};
  for(const c of PNL_CATS){
    const v=rec[c.key];
    if(Array.isArray(v))out[c.key]=v;
    else if(typeof v==='number'&&v>0)out[c.key]=[{id:uid(),date:monthStr+'-01',desc:'Migrated',amount:v}];
    else out[c.key]=[];
  }
  return out;
}
function sumEntries(arr){return (arr||[]).reduce((s,e)=>s+n(e.amount),0);}

function PnLView({ allData, ipRecords }){
  const td=today(); const ty=parseInt(td.slice(0,4)); const tm=parseInt(td.slice(5,7))-1;
  const [year,setYear]=useState(ty); const [month,setMonth]=useState(tm);
  const [manual,setManual]=useState(()=>{try{return JSON.parse(localStorage.getItem(PNL_KEY)||'{}');}catch{return {};}});
  const [staff,setStaff]=useState([]);
  const [staffPaid,setStaffPaid]=useState({});
  const [pharma,setPharma]=useState([]);
  const [expanded,setExpanded]=useState({}); // {catKey: bool}

  useEffect(()=>{
    try{setStaff(JSON.parse(localStorage.getItem(STAFF_KEY)||'[]'));}catch{}
    try{setStaffPaid(JSON.parse(localStorage.getItem(STAFF_PAID_KEY)||'{}'));}catch{}
    try{setPharma(JSON.parse(localStorage.getItem(PHARMA_KEY)||'[]'));}catch{}
  },[year,month]);

  function saveManual(m){setManual(m);try{localStorage.setItem(PNL_KEY,JSON.stringify(m));}catch{}}
  function getMonthRec(ms){return migratePnlMonth(manual[ms]||{},ms);}

  function addEntry(ms,catKey,date,desc,amount){
    if(!date||!amount||n(amount)<=0){alert('Date and amount required');return;}
    const rec=getMonthRec(ms);
    const list=[...(rec[catKey]||[]),{id:uid(),date,desc:desc||'',amount:n(amount)}];
    saveManual({...manual,[ms]:{...rec,[catKey]:list}});
  }
  function deleteEntry(ms,catKey,id){
    const rec=getMonthRec(ms);
    const list=(rec[catKey]||[]).filter(e=>e.id!==id);
    saveManual({...manual,[ms]:{...rec,[catKey]:list}});
  }

  function computeMonth(y,m){
    const ms=`${y}-${String(m+1).padStart(2,'0')}`;
    let opd=0; let medsAuto=0;
    Object.keys(allData).forEach(d=>{
      if(d.startsWith(ms))(allData[d]||[]).forEach(r=>{
        opd+=n(r.opd)+n(r.xray)+n(r.popd)+n(r.pt)+n(r.lab);
        medsAuto+=n(r.medicals);
      });
    });
    let ip=0;
    (ipRecords||[]).forEach(r=>{
      const adm=r.admitDate||r.date||'';
      if(adm.startsWith(ms))ip+=n(r.ipBill||r.bill)+n(r.ipMed||r.medicines);
    });
    let pharmaPaid=0;
    pharma.forEach(e=>{ if(e.date&&e.date.startsWith(ms))pharmaPaid+=n(e.paid); });
    let staffCash=0;
    const monthPaidMap=staffPaid[ms]||{};
    staff.forEach(s=>{ if(monthPaidMap[s.id])staffCash+=salaryFor(s,ms); });

    const rec=getMonthRec(ms);
    const pharmaSalesManual=sumEntries(rec.pharmaSales);
    const pharmaSales=medsAuto+pharmaSalesManual;
    const rent=sumEntries(rec.rent);
    const utilities=sumEntries(rec.utilities);
    const internet=sumEntries(rec.internet);
    const electricity=sumEntries(rec.electricity);
    const other=sumEntries(rec.other);

    const totalIncome=opd+ip+pharmaSales;
    const totalExp=pharmaPaid+staffCash+rent+utilities+internet+electricity+other;
    const net=totalIncome-totalExp;
    const margin=totalIncome>0?Math.round((net/totalIncome)*100):0;

    return {ms,opd,ip,pharmaSales,medsAuto,pharmaSalesManual,pharmaPaid,staffCash,rent,utilities,internet,electricity,other,
      totalIncome,totalExp,net,margin,rec};
  }

  function computeYTD(y,uptoM){
    const acc={opd:0,ip:0,pharmaSales:0,medsAuto:0,pharmaSalesManual:0,pharmaPaid:0,staffCash:0,rent:0,utilities:0,internet:0,electricity:0,other:0,totalIncome:0,totalExp:0,net:0};
    for(let m=0;m<=uptoM;m++){
      const x=computeMonth(y,m);
      ['opd','ip','pharmaSales','medsAuto','pharmaSalesManual','pharmaPaid','staffCash','rent','utilities','internet','electricity','other','totalIncome','totalExp','net'].forEach(k=>{acc[k]+=x[k];});
    }
    acc.margin=acc.totalIncome>0?Math.round((acc.net/acc.totalIncome)*100):0;
    return acc;
  }

  const cur=computeMonth(year,month);
  let prevY=year, prevM=month-1; if(prevM<0){prevM=11;prevY=year-1;}
  const prev=computeMonth(prevY,prevM);
  const ytd=computeYTD(year,month);

  const T=({label,value,sub,color,bg})=>(
    <div style={{background:bg||'var(--w)',border:`1px solid ${color||'var(--bd)'}`,borderRadius:7,padding:'8px 14px',flex:'1 1 0',minWidth:0}}>
      <div style={{fontSize:9,fontWeight:700,color:color||'var(--t3)',textTransform:'uppercase',letterSpacing:'0.7px',whiteSpace:'nowrap'}}>{label}</div>
      <div style={{fontSize:20,fontWeight:700,fontFamily:"'Noto Sans Mono',monospace",color:color||'var(--t1)',lineHeight:1.2,marginTop:3}}>{value}</div>
      {sub&&<div style={{fontSize:10,color:color||'var(--t3)',marginTop:2}}>{sub}</div>}
    </div>
  );

  function row(label,curV,prevV,ytdV,opts={}){
    return (
      <tr style={{borderBottom:'1px solid var(--bd)'}}>
        <td style={{padding:'6px 10px',paddingLeft:opts.indent?24:14,color:'var(--t1)',fontWeight:opts.bold?700:400,fontSize:12}}>
          {label}
          {opts.muted&&<span style={{color:'var(--t3)',fontSize:10,marginLeft:4}}>(manual)</span>}
          {opts.subnote&&<div style={{color:'var(--t3)',fontSize:9,marginTop:1,fontFamily:"'Noto Sans Mono',monospace"}}>{opts.subnote}</div>}
        </td>
        <td style={{padding:'6px 10px',textAlign:'right',fontFamily:"'Noto Sans Mono',monospace",borderLeft:'1px solid var(--bd)',color:opts.bold?'var(--t1)':'var(--t1)',fontWeight:opts.bold?700:400}}>{curV===0?'—':inrZ(curV)}</td>
        <td style={{padding:'6px 10px',textAlign:'right',fontFamily:"'Noto Sans Mono',monospace",borderLeft:'1px solid var(--bd)',color:'var(--t3)',fontWeight:opts.bold?700:400}}>{prevV===0?'—':inrZ(prevV)}</td>
        <td style={{padding:'6px 10px',textAlign:'right',fontFamily:"'Noto Sans Mono',monospace",borderLeft:'1px solid var(--bd)',fontWeight:opts.bold?700:400}}>{ytdV===0?'—':inrZ(ytdV)}</td>
      </tr>
    );
  }

  return (
    <>
      <MonthYearNav year={year} month={month} onChange={(y,m)=>{setYear(y);setMonth(m);}}>
        <div style={{display:'flex',alignItems:'center',gap:14,fontSize:12}}>
          <span style={{color:'var(--t2)'}}>Net: <b style={{color:cur.net>=0?'var(--grntx)':'var(--redtx)',fontFamily:"'Noto Sans Mono',monospace"}}>{cur.net>=0?'+':''}{inrZ(cur.net)}</b></span>
          <span style={{color:'var(--t3)'}}>|</span>
          <span style={{color:'var(--t2)'}}>Margin: <b style={{fontFamily:"'Noto Sans Mono',monospace",color:cur.margin>=0?'var(--t1)':'var(--redtx)'}}>{cur.margin}%</b></span>
        </div>
      </MonthYearNav>

      {/* KPI tiles */}
      <div style={{background:'var(--bg)',borderBottom:'1px solid var(--bd)',padding:'8px 12px',display:'flex',gap:8,flexShrink:0}}>
        <T label="Income" value={inrZ(cur.totalIncome)} color="var(--grntx)" bg="var(--grnbg)"/>
        <T label="Expenses" value={inrZ(cur.totalExp)} color="var(--redtx)" bg="var(--redbg)"/>
        <T label="Net" value={(cur.net>=0?'+':'')+inrZ(cur.net)} color="var(--blutx)" bg="var(--blubg)"/>
        <T label="Margin" value={cur.margin+'%'} color="var(--ambtx)" bg="var(--ambbg)"/>
      </div>

      {/* Manual entries — collapsible */}
      <div style={{background:'var(--w)',borderBottom:'1px solid var(--bd)',padding:'10px 14px',flexShrink:0}}>
        <div style={{fontSize:10,fontWeight:700,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:6}}>Manual entries — {MONTHS_LONG[month]} {year} <span style={{color:'var(--t3)',fontWeight:400,textTransform:'none',letterSpacing:'normal',marginLeft:6}}>click row to expand</span></div>
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          {PNL_CATS.map(c=>{
            const list=cur.rec[c.key]||[];
            const total=sumEntries(list);
            const isOpen=expanded[c.key];
            return (
              <PnLCategoryRow key={c.key} cat={c} entries={list} total={total} open={isOpen}
                onToggle={()=>setExpanded({...expanded,[c.key]:!isOpen})}
                onAdd={(d,desc,amt)=>addEntry(cur.ms,c.key,d,desc,amt)}
                onDelete={id=>deleteEntry(cur.ms,c.key,id)}/>
            );
          })}
        </div>
      </div>

      {/* Main P&L table */}
      <div style={{flex:1,overflowY:'auto',background:'var(--bg)',padding:12}}>
        <div style={{background:'var(--w)',border:'1px solid var(--bd)',borderRadius:8,overflow:'hidden'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead>
              <tr style={{background:'var(--g0)',borderBottom:'1px solid var(--bd)'}}>
                <th style={{padding:'8px 14px',textAlign:'left',color:'var(--t3)',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px'}}>Category</th>
                <th style={{padding:'8px 10px',textAlign:'right',color:'var(--t1)',fontWeight:700,fontSize:11,borderLeft:'1px solid var(--bd)',width:140}}>{MONTHS_LONG[month].slice(0,3)} {year}</th>
                <th style={{padding:'8px 10px',textAlign:'right',color:'var(--t3)',fontWeight:700,fontSize:11,borderLeft:'1px solid var(--bd)',width:140}}>{MONTHS_LONG[prevM].slice(0,3)} {prevY}</th>
                <th style={{padding:'8px 10px',textAlign:'right',color:'var(--t1)',fontWeight:700,fontSize:11,borderLeft:'1px solid var(--bd)',width:140}}>YTD {year}</th>
              </tr>
            </thead>
            <tbody>
              <tr style={{background:'var(--grnbg)'}}>
                <td colSpan="4" style={{padding:'5px 14px',fontSize:10,fontWeight:700,color:'var(--grntx)',textTransform:'uppercase',letterSpacing:'0.5px',borderBottom:'1px solid var(--bd)'}}>Income</td>
              </tr>
              {row('OPD',cur.opd,prev.opd,ytd.opd,{indent:true})}
              {row('IP',cur.ip,prev.ip,ytd.ip,{indent:true})}
              {row(`Pharma sales`,cur.pharmaSales,prev.pharmaSales,ytd.pharmaSales,{indent:true,subnote:`auto ${inrZ(cur.medsAuto)} + manual ${inrZ(cur.pharmaSalesManual)}`})}
              <tr style={{background:'var(--g0)',borderBottom:'2px solid var(--bd2)'}}>

                <td style={{padding:'7px 10px',textAlign:'right',fontFamily:"'Noto Sans Mono',monospace",fontWeight:700,color:'var(--redtx)',borderLeft:'1px solid var(--bd)'}}>{inrZ(ytd.totalExp)}</td>

                <td style={{padding:'10px 10px',textAlign:'right',fontFamily:"'Noto Sans Mono',monospace",fontWeight:700,color:cur.net>=0?'var(--blutx)':'var(--redtx)',borderLeft:'1px solid var(--bd)'}}>{(cur.net>=0?'+':'')}{inrZ(cur.net)}</td>
                <td style={{padding:'10px 10px',textAlign:'right',fontFamily:"'Noto Sans Mono',monospace",fontWeight:700,color:'var(--t3)',borderLeft:'1px solid var(--bd)'}}>{(prev.net>=0?'+':'')}{inrZ(prev.net)}</td>
                <td style={{padding:'10px 10px',textAlign:'right',fontFamily:"'Noto Sans Mono',monospace",fontWeight:700,color:ytd.net>=0?'var(--blutx)':'var(--redtx)',borderLeft:'1px solid var(--bd)'}}>{(ytd.net>=0?'+':'')}{inrZ(ytd.net)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}

// Shared P&L month computation (for any tab that needs it)
function computePnlMonth(y,m,deps){
  const {allData,ipRecords,pharma,staff,staffPaid,manual}=deps;
  const ms=`${y}-${String(m+1).padStart(2,'0')}`;
  let opd=0; let medsAuto=0;
  Object.keys(allData||{}).forEach(d=>{
    if(d.startsWith(ms))(allData[d]||[]).forEach(r=>{
      opd+=n(r.opd)+n(r.xray)+n(r.popd)+n(r.pt)+n(r.lab);
      medsAuto+=n(r.medicals);
    });
  });
  let ip=0;
  (ipRecords||[]).forEach(r=>{
    const adm=r.admitDate||r.date||'';
    if(adm.startsWith(ms))ip+=n(r.ipBill||r.bill)+n(r.ipMed||r.medicines);
  });
  let pharmaPaid=0;
  (pharma||[]).forEach(e=>{ if(e.date&&e.date.startsWith(ms))pharmaPaid+=n(e.paid); });
  let staffCash=0;
  const monthPaidMap=(staffPaid||{})[ms]||{};
  (staff||[]).forEach(s=>{ if(monthPaidMap[s.id])staffCash+=salaryFor(s,ms); });
  const rec=migratePnlMonth((manual||{})[ms]||{},ms);
  const pharmaSalesManual=sumEntries(rec.pharmaSales);
  const pharmaSales=medsAuto+pharmaSalesManual;
  const otherExp=sumEntries(rec.rent)+sumEntries(rec.utilities)+sumEntries(rec.internet)+sumEntries(rec.electricity)+sumEntries(rec.other);
  const totalIncome=opd+ip+pharmaSales;
  const totalExp=pharmaPaid+staffCash+otherExp;
  const net=totalIncome-totalExp;
  return {ms,y,m,opd,ip,pharmaSales,pharmaPaid,staffCash,otherExp,totalIncome,totalExp,net};
}

function TrendsView({ allData, ipRecords }){
  const td=today(); const ty=parseInt(td.slice(0,4)); const tm=parseInt(td.slice(5,7))-1;
  const [year,setYear]=useState(ty);
  const [month,setMonth]=useState(tm);
  const [staff,setStaff]=useState([]);
  const [staffPaid,setStaffPaid]=useState({});
  const [pharma,setPharma]=useState([]);
  const [manual,setManual]=useState({});

  useEffect(()=>{
    try{setStaff(JSON.parse(localStorage.getItem(STAFF_KEY)||'[]'));}catch{}
    try{setStaffPaid(JSON.parse(localStorage.getItem(STAFF_PAID_KEY)||'{}'));}catch{}
    try{setPharma(JSON.parse(localStorage.getItem(PHARMA_KEY)||'[]'));}catch{}
    try{setManual(JSON.parse(localStorage.getItem(PNL_KEY)||'{}'));}catch{}
  },[]);

  function prevMonth(){let y=year,m=month-1;if(m<0){m=11;y--;}setYear(y);setMonth(m);}
  function nextMonth(){let y=year,m=month+1;if(m>11){m=0;y++;}setYear(y);setMonth(m);}

  const monthStr=`${year}-${String(month+1).padStart(2,'0')}`;
  const daysInMonth=new Date(year,month+1,0).getDate();

  // Build per-day breakdown
  const daily=[];
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${monthStr}-${String(d).padStart(2,'0')}`;
    let cons=0, proc=0, med=0, pts=0;
    (allData[ds]||[]).forEach(r=>{
      cons+=n(r.opd)+n(r.popd);
      proc+=n(r.xray)+n(r.pt)+n(r.lab);
      med+=n(r.medicals);
      pts++;
    });
    daily.push({day:d,cons,proc,med,pts,total:cons+proc+med});
  }

  // Working days = days with any patient
  const workingDays=daily.filter(d=>d.pts>0).length;

  // IP revenue for the month
  let ipRev=0;
  (ipRecords||[]).forEach(r=>{
    const adm=r.admitDate||r.date||'';
    if(adm.startsWith(monthStr))ipRev+=n(r.ipBill||r.bill)+n(r.ipMed||r.medicines);
  });

  // Aggregates
  const sumCons=daily.reduce((s,d)=>s+d.cons,0);
  const sumProc=daily.reduce((s,d)=>s+d.proc,0);
  const sumMed=daily.reduce((s,d)=>s+d.med,0);
  const grossRev=sumCons+sumProc+sumMed+ipRev;

  // Expenses
  let pharmaPaid=0;
  (pharma||[]).forEach(e=>{ if(e.date&&e.date.startsWith(monthStr))pharmaPaid+=n(e.paid); });
  let staffCash=0;
  const monthPaidMap=(staffPaid||{})[monthStr]||{};
  (staff||[]).forEach(s=>{ if(monthPaidMap[s.id])staffCash+=salaryFor(s,monthStr); });
  const rec=migratePnlMonth((manual||{})[monthStr]||{},monthStr);
  const otherExp=sumEntries(rec.rent)+sumEntries(rec.utilities)+sumEntries(rec.internet)+sumEntries(rec.electricity)+sumEntries(rec.other);
  const totalExp=pharmaPaid+staffCash+otherExp;
  const netProfit=grossRev-totalExp;

  // Colors
  const C_CONS='#1565c0';   // blue
  const C_PROC='#7c3aed';   // purple
  const C_MED='#0d9488';    // teal
  const C_IP='#d97706';     // amber for IP slice
  const C_PTS='#ea580c';    // orange line
  const C_SAL='#dc2626';    // red
  const C_PHARM='#9333ea';  // violet
  const C_NET='#16a34a';    // green

  // KPI tile
  const KPI=({label,value,sub,color,bg})=>(
    <div style={{background:bg||'var(--w)',border:'1px solid var(--bd)',borderRadius:8,padding:'10px 12px',flex:1,minWidth:130}}>
      <div style={{fontSize:9,fontWeight:700,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'0.6px'}}>{label}</div>
      <div style={{fontSize:17,fontWeight:700,color:color||'var(--t1)',fontFamily:"'Noto Sans Mono',monospace",marginTop:3}}>{value}</div>
      {sub&&<div style={{fontSize:10,color:'var(--t3)',marginTop:2}}>{sub}</div>}
    </div>
  );

  // Stacked bar chart dimensions
  const BW=Math.max(700,daysInMonth*22);
  const BH=240;
  const BPAD={t:14,r:14,b:24,l:46};
  const maxStack=Math.max(1,...daily.map(d=>d.total));
  const niceMax=Math.ceil(maxStack/1000)*1000||1000;
  const xFor=i=>BPAD.l+(i+0.5)*((BW-BPAD.l-BPAD.r)/daysInMonth);
  const yFor=v=>BPAD.t+(BH-BPAD.t-BPAD.b)*(1-v/niceMax);
  const barW=Math.min(18,(BW-BPAD.l-BPAD.r)/daysInMonth-2);

  // Patient line chart
  const LH=160;
  const LPAD={t:12,r:14,b:24,l:36};
  const maxPts=Math.max(1,...daily.map(d=>d.pts));
  const niceMaxP=Math.ceil(maxPts/5)*5||5;
  const lyFor=v=>LPAD.t+(LH-LPAD.t-LPAD.b)*(1-v/niceMaxP);
  const lxFor=i=>LPAD.l+(i+0.5)*((BW-LPAD.l-LPAD.r)/daysInMonth);
  const ptsPath=daily.map((d,i)=>`${i===0?'M':'L'}${lxFor(i).toFixed(1)},${lyFor(d.pts).toFixed(1)}`).join(' ');

  // Pie chart helper
  function pieSlices(items,cx,cy,r){
    const total=items.reduce((s,i)=>s+i.value,0);
    if(total<=0)return [];
    let a=-Math.PI/2;
    return items.map(it=>{
      const frac=it.value/total;
      const a2=a+frac*Math.PI*2;
      const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a);
      const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
      const large=frac>0.5?1:0;
      const path=`M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
      const mid=(a+a2)/2;
      const lx=cx+(r*0.6)*Math.cos(mid),ly=cy+(r*0.6)*Math.sin(mid);
      a=a2;
      return {...it,path,frac,lx,ly};
    });
  }

  const pie1=pieSlices([
    {label:'Consultation',value:sumCons,color:C_CONS},
    {label:'Procedures',value:sumProc,color:C_PROC},
    {label:'Medical',value:sumMed,color:C_MED},
    {label:'IP Revenue',value:ipRev,color:C_IP}
  ],90,90,80);
  const pie2=pieSlices([
    {label:'Salary',value:staffCash,color:C_SAL},
    {label:'Pharma',value:pharmaPaid,color:C_PHARM},
    {label:'Other Exp',value:otherExp,color:'#f59e0b'},
    {label:'Net Profit',value:Math.max(0,netProfit),color:C_NET}
  ],90,90,80);

  const Legend=({items})=>(
    <div style={{display:'flex',flexDirection:'column',gap:5,fontSize:11,minWidth:0}}>
      {items.map(it=>(
        <div key={it.label} style={{display:'flex',alignItems:'center',gap:6,minWidth:0}}>
          <div style={{width:10,height:10,background:it.color,borderRadius:2,flexShrink:0}}/>
          <div style={{color:'var(--t2)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{it.label}</div>
          <div style={{color:'var(--t1)',fontWeight:700,fontFamily:"'Noto Sans Mono',monospace",marginLeft:'auto'}}>{Math.round(it.frac*100)||0}%</div>
        </div>
      ))}
    </div>
  );

  const ChartCard=({title,children})=>(
    <div style={{background:'var(--w)',border:'1px solid var(--bd)',borderRadius:8,padding:12,marginBottom:12}}>
      <div style={{fontSize:11,fontWeight:700,color:'var(--t2)',textTransform:'uppercase',letterSpacing:'0.6px',marginBottom:10}}>{title}</div>
      {children}
    </div>
  );

  return (
    <>
      {/* Month nav */}
      <div style={{background:'var(--w)',borderBottom:'1px solid var(--bd)',padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'center',gap:10,flexShrink:0}}>
        <button onClick={prevMonth} style={{background:'var(--w)',border:'1px solid var(--bd2)',borderRadius:6,padding:'6px 12px',fontSize:13,fontWeight:700,cursor:'pointer',color:'var(--t1)'}}>‹</button>
        <div style={{fontWeight:700,fontSize:14,color:'var(--t1)',minWidth:160,textAlign:'center'}}>{MONTHS_LONG[month]} {year}</div>
        <button onClick={nextMonth} style={{background:'var(--w)',border:'1px solid var(--bd2)',borderRadius:6,padding:'6px 12px',fontSize:13,fontWeight:700,cursor:'pointer',color:'var(--t1)'}}>›</button>
      </div>

      <div style={{flex:1,overflowY:'auto',background:'var(--bg)',padding:12}}>
        {/* KPI tiles */}
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}}>
          <KPI label="Gross Revenue" value={inrZ(grossRev)} color="var(--grntx)" bg="var(--grnbg)"/>
          <KPI label="Total Expenses" value={inrZ(totalExp)} color="var(--redtx)" bg="var(--redbg)"/>
          <KPI label="Net Profit" value={(netProfit>=0?'+':'')+inrZ(netProfit)} color={netProfit>=0?'var(--blutx)':'var(--redtx)'} bg={netProfit>=0?'var(--blubg)':'var(--redbg)'}/>
          <KPI label="Working Days" value={workingDays} sub={`of ${daysInMonth}`}/>
        </div>

        {/* Daily Revenue Breakdown - stacked bars */}
        <ChartCard title="Daily Revenue Breakdown">
          <div style={{overflowX:'auto'}}>
            <svg viewBox={`0 0 ${BW} ${BH}`} style={{width:BW,height:BH,display:'block'}}>
              {/* gridlines */}
              {[0,0.25,0.5,0.75,1].map(g=>{
                const y=BPAD.t+(BH-BPAD.t-BPAD.b)*g;
                const v=Math.round(niceMax*(1-g));
                return (
                  <g key={g}>
                    <line x1={BPAD.l} y1={y} x2={BW-BPAD.r} y2={y} stroke="var(--bd)" strokeWidth="1"/>
                    <text x={BPAD.l-4} y={y+3} textAnchor="end" fontSize="9" fill="var(--t3)" fontFamily="'Noto Sans Mono',monospace">{v>=1000?(v/1000).toFixed(0)+'k':v}</text>
                  </g>
                );
              })}
              {/* bars */}
              {daily.map((d,i)=>{
                const x=xFor(i)-barW/2;
                const yC=yFor(d.cons);
                const hC=BH-BPAD.b-yC;
                const yP=yFor(d.cons+d.proc);
                const hP=yFor(d.cons)-yP;
                const yM=yFor(d.cons+d.proc+d.med);
                const hM=yFor(d.cons+d.proc)-yM;
                return (
                  <g key={d.day}>
                    {d.cons>0&&<rect x={x} y={yC} width={barW} height={hC} fill={C_CONS}/>}
                    {d.proc>0&&<rect x={x} y={yP} width={barW} height={hP} fill={C_PROC}/>}
                    {d.med>0&&<rect x={x} y={yM} width={barW} height={hM} fill={C_MED}/>}
                    <text x={xFor(i)} y={BH-BPAD.b+12} textAnchor="middle" fontSize="9" fill="var(--t3)" fontFamily="'Noto Sans Mono',monospace">{d.day}</text>
                  </g>
                );
              })}
            </svg>
          </div>
          <div style={{display:'flex',gap:14,fontSize:11,marginTop:8,flexWrap:'wrap'}}>
            <div style={{display:'flex',alignItems:'center',gap:5}}><div style={{width:11,height:11,background:C_CONS,borderRadius:2}}/><span style={{color:'var(--t2)'}}>Consultation</span></div>
            <div style={{display:'flex',alignItems:'center',gap:5}}><div style={{width:11,height:11,background:C_PROC,borderRadius:2}}/><span style={{color:'var(--t2)'}}>Procedures</span></div>
            <div style={{display:'flex',alignItems:'center',gap:5}}><div style={{width:11,height:11,background:C_MED,borderRadius:2}}/><span style={{color:'var(--t2)'}}>Medical</span></div>
          </div>
        </ChartCard>

        {/* Daily Patient Count - line */}
        <ChartCard title="Daily Patient Count">
          <div style={{overflowX:'auto'}}>
            <svg viewBox={`0 0 ${BW} ${LH}`} style={{width:BW,height:LH,display:'block'}}>
              {[0,0.5,1].map(g=>{
                const y=LPAD.t+(LH-LPAD.t-LPAD.b)*g;
                const v=Math.round(niceMaxP*(1-g));
                return (
                  <g key={g}>
                    <line x1={LPAD.l} y1={y} x2={BW-LPAD.r} y2={y} stroke="var(--bd)" strokeWidth="1"/>
                    <text x={LPAD.l-4} y={y+3} textAnchor="end" fontSize="9" fill="var(--t3)" fontFamily="'Noto Sans Mono',monospace">{v}</text>
                  </g>
                );
              })}
              <path d={ptsPath} fill="none" stroke={C_PTS} strokeWidth="2" strokeLinejoin="round"/>
              {daily.map((d,i)=>(
                <g key={d.day}>
                  {d.pts>0&&<circle cx={lxFor(i)} cy={lyFor(d.pts)} r="2.5" fill={C_PTS}/>}
                  {i%2===0&&<text x={lxFor(i)} y={LH-LPAD.b+12} textAnchor="middle" fontSize="9" fill="var(--t3)" fontFamily="'Noto Sans Mono',monospace">{d.day}</text>}
                </g>
              ))}
            </svg>
          </div>
        </ChartCard>

        {/* Two pies side-by-side */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <ChartCard title="Revenue Split">
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <svg viewBox="0 0 180 180" style={{width:130,height:130,flexShrink:0}}>
                {pie1.length>0?pie1.map((s,i)=><path key={i} d={s.path} fill={s.color} stroke="var(--w)" strokeWidth="1"/>):<circle cx="90" cy="90" r="80" fill="var(--g0)"/>}
              </svg>
              <Legend items={pie1}/>

// Compute month with both cash & gross views
function computePnlMonthDual(y,m,deps){
  const {allData,ipRecords,pharma,staff,staffPaid,manual}=deps;
  const ms=`${y}-${String(m+1).padStart(2,'0')}`;
  let opd=0; let medsAuto=0; let patientCount=0;
  Object.keys(allData||{}).forEach(d=>{
    if(d.startsWith(ms))(allData[d]||[]).forEach(r=>{
      opd+=n(r.opd)+n(r.xray)+n(r.popd)+n(r.pt)+n(r.lab);
      medsAuto+=n(r.medicals);
      patientCount++;
    });
  });
  let ip=0; let ipCount=0;
  (ipRecords||[]).forEach(r=>{
    const adm=r.admitDate||r.date||'';
    if(adm.startsWith(ms)){ip+=n(r.ipBill||r.bill)+n(r.ipMed||r.medicines);ipCount++;}
  });
  // Cash vs gross for Pharma & Staff
  let pharmaCash=0, pharmaGross=0;
  (pharma||[]).forEach(e=>{ if(e.date&&e.date.startsWith(ms)){pharmaCash+=n(e.paid);pharmaGross+=n(e.amount);} });
  let staffCash=0, staffGross=0;
  const monthPaidMap=(staffPaid||{})[ms]||{};
  (staff||[]).forEach(s=>{
    const sal=salaryFor(s,ms);
    staffGross+=sal;
    if(monthPaidMap[s.id])staffCash+=sal;
  });
  const rec=migratePnlMonth((manual||{})[ms]||{},ms);
  const pharmaSalesManual=sumEntries(rec.pharmaSales);
  const pharmaSales=medsAuto+pharmaSalesManual;
  const rent=sumEntries(rec.rent);
  const utilities=sumEntries(rec.utilities);
  const internet=sumEntries(rec.internet);
  const electricity=sumEntries(rec.electricity);
  const other=sumEntries(rec.other);

  return {ms,y,m,opd,ip,pharmaSales,medsAuto,
    pharmaCash,pharmaGross,staffCash,staffGross,
    rent,utilities,internet,electricity,other,
    patientCount:patientCount+ipCount};
}

    const rows=allData[dateStr]||[];
    let consult=0, xpl=0, medical=0;
    rows.forEach(r=>{
      consult+=n(r.opd)+n(r.popd);
      xpl+=n(r.xray)+n(r.pt)+n(r.lab);
      medical+=n(r.medicals);
    });
    const total=consult+xpl+medical;
    const patients=rows.length;
    const dt=new Date(dateStr+'T00:00:00');
    dailyRows.push({date:dateStr,day:DAYS[dt.getDay()],consult,xpl,medical,total,patients});
    totConsult+=consult; totXpl+=xpl; totMedical+=medical; totDayTotal+=total; totPatients+=patients;
  }

  // IP for the month
  let ipRev=0, ipCount=0;
  (ipRecords||[]).forEach(r=>{
    const adm=r.admitDate||r.date||'';
    if(adm.startsWith(ms)){ipRev+=n(r.ipBill||r.bill)+n(r.ipMed||r.medicines);ipCount++;}
  });

  // Expenses (cash basis matches P&L)
  let pharmaCost=0;
  pharma.forEach(e=>{ if(e.date&&e.date.startsWith(ms))pharmaCost+=n(e.paid); });
  let staffCost=0;
  const monthPaidMap=staffPaid[ms]||{};
  staff.forEach(s=>{ if(monthPaidMap[s.id])staffCost+=salaryFor(s,ms); });
  const rec=migratePnlMonth(manual[ms]||{},ms);
  const otherExp=sumEntries(rec.rent)+sumEntries(rec.utilities)+sumEntries(rec.internet)+sumEntries(rec.electricity)+sumEntries(rec.other);
  const totalExp=pharmaCost+staffCost+otherExp;

  // Income summary
  const opdIncome=totDayTotal; // all OPD activity (consult+xpl+medical)
  const grossRev=opdIncome+ipRev;
  const netProfit=grossRev-totalExp;
  const margin=grossRev>0?Math.round((netProfit/grossRev)*100):0;
  const totPatientsAll=totPatients+ipCount;

  function doPrint(){window.print();}

  const Tile=({label,value,sub,color,bg})=>(
    <div style={{background:bg,color:'#fff',borderRadius:8,padding:'12px 16px',flex:'1 1 0',minWidth:140}}>
      <div style={{fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.7px',whiteSpace:'nowrap',opacity:0.95}}>{label}</div>
      <div style={{fontSize:22,fontWeight:700,fontFamily:"'Noto Sans Mono',monospace",lineHeight:1.2,marginTop:3}}>{value}</div>
      {sub&&<div style={{fontSize:10,marginTop:2,opacity:0.9}}>{sub}</div>}
    </div>
  );

  return (
    <>
      <style>{`@media print {
        .vh-no-print { display: none !important; }
        body { background: #fff !important; }
        table { page-break-inside: auto; }
        tr { page-break-inside: avoid; }
      }`}</style>

      <div style={{background:'var(--w)',borderBottom:'1px solid var(--bd)',padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexShrink:0}} className="vh-no-print">
        <MonthYearNav year={year} month={month} onChange={(y,m)=>{setYear(y);setMonth(m);}}/>
        <button onClick={doPrint} style={{background:'var(--blu)',color:'#fff',border:'none',borderRadius:5,padding:'7px 16px',fontSize:12,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>🖨 Print / PDF</button>
      </div>

      <div style={{flex:1,overflowY:'auto',background:'#dde8f5',padding:14}}>
        {/* Header card */}
        <div style={{padding:'4px 4px 14px'}}>
          <div style={{fontSize:22,fontWeight:700,color:'var(--t1)'}}>VH Hospital — {MONTHS_LONG[month]} {year}</div>
          <div style={{fontSize:12,color:'var(--t3)',marginTop:2}}>Monthly Financial Statement | Dr. Ram</div>
        </div>

        {/* KPI tiles */}
        <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:14}}>
          <Tile label="Gross Revenue" value={inrZ(grossRev)} sub="OP + IP" bg="#0f7553"/>
          <Tile label="OPD Income" value={inrZ(opdIncome)} sub={`${totPatients} patients`} bg="#1565c0"/>
          <Tile label="IP Revenue" value={inrZ(ipRev)} sub={`${ipCount} admissions`} bg="#6a1b9a"/>
          <Tile label="Total Expenses" value={inrZ(totalExp)} bg="#c62828"/>
          <Tile label="Net Profit" value={inrZ(netProfit)} sub={`Margin: ${margin}%`} bg="#2e7d32"/>
        </div>

        {/* Income / Expenditure cards */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
          <div style={{background:'var(--w)',borderRadius:8,padding:18}}>
            <div style={{fontSize:11,fontWeight:700,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:14}}>Income</div>
            <div style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--bd)',fontSize:13}}>
              <span>Consultation (Census)</span>
              <span style={{fontFamily:"'Noto Sans Mono',monospace",color:'var(--blutx)',fontWeight:600}}>{inrZ(totConsult)}</span>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--bd)',fontSize:13}}>
              <span>Procedures / XPL</span>
              <span style={{fontFamily:"'Noto Sans Mono',monospace",color:'var(--blutx)',fontWeight:600}}>{inrZ(totXpl)}</span>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--bd)',fontSize:13}}>
              <span>Medical Sales</span>
              <span style={{fontFamily:"'Noto Sans Mono',monospace",color:'var(--blutx)',fontWeight:600}}>{inrZ(totMedical)}</span>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--bd)',fontSize:13}}>
              <span>IP Revenue</span>
              <span style={{fontFamily:"'Noto Sans Mono',monospace",color:'var(--blutx)',fontWeight:600}}>{inrZ(ipRev)}</span>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',padding:'10px 0 0',fontSize:14,fontWeight:700}}>
              <span>Gross Total</span>
              <span style={{fontFamily:"'Noto Sans Mono',monospace",color:'var(--grntx)'}}>{inrZ(grossRev)}</span>
            </div>
          </div>

          <div style={{background:'var(--w)',borderRadius:8,padding:18}}>
            <div style={{fontSize:11,fontWeight:700,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:14}}>Expenditure</div>
            <div style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--bd)',fontSize:13}}>
              <span>Pharma & Supplies</span>
              <span style={{fontFamily:"'Noto Sans Mono',monospace",color:'var(--redtx)',fontWeight:600}}>{inrZ(pharmaCost)}</span>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--bd)',fontSize:13}}>
              <span>Staff Salaries</span>
              <span style={{fontFamily:"'Noto Sans Mono',monospace",color:'var(--redtx)',fontWeight:600}}>{inrZ(staffCost)}</span>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--bd)',fontSize:13}}>
              <span>Other (Rent, EB etc.)</span>
              <span style={{fontFamily:"'Noto Sans Mono',monospace",color:'var(--redtx)',fontWeight:600}}>{inrZ(otherExp)}</span>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',padding:'10px 0 0',fontSize:14,fontWeight:700}}>
              <span>Total Expenses</span>
              <span style={{fontFamily:"'Noto Sans Mono',monospace",color:'var(--redtx)'}}>{inrZ(totalExp)}</span>
            </div>
          </div>
        </div>

        {/* Daily Register */}
        <div style={{background:'var(--w)',borderRadius:8,overflow:'hidden',marginBottom:14}}>
          <div style={{background:'#1a1a1a',color:'#fff',padding:'10px 16px',fontSize:12,fontWeight:700}}>
            Daily Register — {MONTHS_LONG[month]} {year}
          </div>
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,minWidth:680}}>
              <thead>
                <tr style={{background:'#1a1a1a',color:'#fff'}}>
                  <th style={{padding:'8px 14px',textAlign:'left',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px'}}>Date</th>

                  <th style={{padding:'8px 14px',textAlign:'right',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px'}}>Consult ₹</th>
                  <th style={{padding:'8px 14px',textAlign:'right',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px'}}>XPL ₹</th>
                  <th style={{padding:'8px 14px',textAlign:'right',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px'}}>Medical ₹</th>
                  <th style={{padding:'8px 14px',textAlign:'right',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px'}}>Total ₹</th>
                  <th style={{padding:'8px 14px',textAlign:'right',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px'}}>Patients</th>

              </thead>
              <tbody>
                {dailyRows.map(r=>{
                  const isWeekend=r.day==='Sat'||r.day==='Sun';
                  const isEmpty=r.total===0&&r.patients===0;
                  return (

                      <td style={{padding:'7px 14px',color:isEmpty?'var(--t3)':'var(--t1)'}}>{r.date}</td>
                      <td style={{padding:'7px 14px',color:isEmpty?'var(--t3)':'var(--t2)'}}>{r.day}</td>
                      <td style={{padding:'7px 14px',textAlign:'right',fontFamily:"'Noto Sans Mono',monospace",color:r.consult>0?'var(--t1)':'var(--t3)'}}>{r.consult>0?inrZ(r.consult):'—'}</td>
                      <td style={{padding:'7px 14px',textAlign:'right',fontFamily:"'Noto Sans Mono',monospace",color:r.xpl>0?'var(--t1)':'var(--t3)'}}>{r.xpl>0?inrZ(r.xpl):'—'}</td>

                      <td style={{padding:'7px 14px',textAlign:'right',fontFamily:"'Noto Sans Mono',monospace",color:r.patients>0?'var(--t1)':'var(--t3)'}}>{r.patients>0?r.patients:'—'}</td>
