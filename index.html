// PERSONAL TAB
// ═══════════════════════════════════════════════════════════════
const PERSONAL_KEY='vh-personal';
const PERSONAL_CATS=[
  {key:'groceries',label:'Groceries',icon:'🛒',color:'#2e7d32'},
  {key:'fuel',label:'Fuel',icon:'⛽',color:'#e65100'},
  {key:'dining',label:'Dining',icon:'🍽️',color:'#c62828'},
  {key:'bills',label:'Bills',icon:'📄',color:'#1565c0'},
  {key:'health',label:'Health',icon:'🏥',color:'#6a1b9a'},
  {key:'education',label:'Education',icon:'📚',color:'#00838f'},
  {key:'travel',label:'Travel',icon:'✈️',color:'#0277bd'},
  {key:'shopping',label:'Shopping',icon:'🛍️',color:'#ad1457'},
  {key:'other',label:'Other',icon:'📌',color:'#5d4037'}
];

function PersonalView(){
  const td=today(); const ty=parseInt(td.slice(0,4)); const tm=parseInt(td.slice(5,7))-1;
  const [year,setYear]=useState(ty); const [month,setMonth]=useState(tm);
  const [entries,setEntries]=useState(()=>{try{return JSON.parse(localStorage.getItem(PERSONAL_KEY)||'[]');}catch{return [];}});
  const [date,setDate]=useState(today());
  const [cat,setCat]=useState('groceries');
  const [desc,setDesc]=useState('');
  const [amount,setAmount]=useState('');

  function save(arr){setEntries(arr);try{localStorage.setItem(PERSONAL_KEY,JSON.stringify(arr));}catch{}}

  const ms=`${year}-${String(month+1).padStart(2,'0')}`;
  const monthEntries=entries.filter(e=>e.date&&e.date.startsWith(ms));
  const total=monthEntries.reduce((s,e)=>s+n(e.amount),0);

  // Per-category totals
  const catTotals={};
  PERSONAL_CATS.forEach(c=>{catTotals[c.key]=0;});
  monthEntries.forEach(e=>{ catTotals[e.cat]=(catTotals[e.cat]||0)+n(e.amount); });

  function add(){
    if(!date||!amount||n(amount)<=0){alert('Date and amount required');return;}
    save([...entries,{id:uid(),date,cat,desc:desc.trim(),amount:n(amount)}]);
    setDesc(''); setAmount(''); // keep date+cat
  }
  function del(id){if(confirm('Delete this entry?'))save(entries.filter(e=>e.id!==id));}

  const catObj=Object.fromEntries(PERSONAL_CATS.map(c=>[c.key,c]));

  return (
    <>
      <MonthYearNav year={year} month={month} onChange={(y,m)=>{setYear(y);setMonth(m);}}>
        <span style={{fontSize:14,fontWeight:700,marginLeft:8}}>💼 Personal</span>
      </MonthYearNav>

      <div style={{flex:1,overflowY:'auto',background:'#dcf0e0',padding:14}}>
        {/* Total tile */}
        <div style={{background:'var(--red)',color:'#fff',borderRadius:8,padding:'14px 18px',display:'inline-block',minWidth:200,marginBottom:14}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.7px',opacity:0.9}}>Total Spend</div>
          <div style={{fontSize:28,fontWeight:700,fontFamily:"'Noto Sans Mono',monospace",marginTop:4}}>{inrZ(total)}</div>
          <div style={{fontSize:11,opacity:0.9,marginTop:2}}>{monthEntries.length} {monthEntries.length===1?'entry':'entries'}</div>
        </div>

        {/* Category breakdown */}
        {monthEntries.length>0&&(
          <div style={{background:'var(--w)',borderRadius:8,padding:14,marginBottom:14}}>
            <div style={{fontSize:10,fontWeight:700,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:10}}>Category Breakdown</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:8}}>
              {PERSONAL_CATS.filter(c=>catTotals[c.key]>0).map(c=>{
                const pct=total>0?Math.round((catTotals[c.key]/total)*100):0;
                return (
                  <div key={c.key} style={{padding:'8px 10px',border:'1px solid var(--bd)',borderRadius:6,background:'var(--g0)'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                      <span style={{fontSize:11,fontWeight:600,color:c.color}}>{c.icon} {c.label}</span>
                      <span style={{fontSize:9,color:'var(--t3)',fontWeight:700}}>{pct}%</span>
                    </div>
                    <div style={{fontFamily:"'Noto Sans Mono',monospace",fontSize:13,fontWeight:700,color:'var(--t1)'}}>{inrZ(catTotals[c.key])}</div>
                    {/* progress bar */}
                    <div style={{height:4,background:'var(--bd)',borderRadius:2,marginTop:4,overflow:'hidden'}}>
                      <div style={{height:'100%',background:c.color,width:`${pct}%`,transition:'width 0.3s'}}></div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Add expense form */}
        <div style={{background:'var(--w)',borderRadius:8,padding:14,marginBottom:14}}>
          <div style={{fontSize:10,fontWeight:700,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:8}}>Add Expense</div>
          <div style={{display:'grid',gridTemplateColumns:'140px 150px 1fr 110px 70px',gap:6,alignItems:'center'}}>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)}
              style={{border:'1px solid var(--bd2)',borderRadius:5,padding:'7px 9px',fontSize:12,outline:'none'}}/>
            <select value={cat} onChange={e=>setCat(e.target.value)}
              style={{border:'1px solid var(--bd2)',borderRadius:5,padding:'7px 9px',fontSize:12,outline:'none',background:'var(--w)'}}>
              {PERSONAL_CATS.map(c=><option key={c.key} value={c.key}>{c.icon} {c.label}</option>)}
            </select>
            <input value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Description (optional)"
              style={{border:'1px solid var(--bd2)',borderRadius:5,padding:'7px 9px',fontSize:12,outline:'none'}}/>
            <input type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="Amount ₹" onKeyDown={e=>{if(e.key==='Enter'&&amount)add();}}
              style={{border:'1px solid var(--bd2)',borderRadius:5,padding:'7px 9px',fontSize:12,fontFamily:"'Noto Sans Mono',monospace",textAlign:'right',outline:'none'}}/>
            <button onClick={add} disabled={!amount} style={{background:amount?'var(--g7)':'var(--dis)',color:'#fff',border:'none',borderRadius:5,padding:'7px 0',cursor:amount?'pointer':'not-allowed',fontSize:13,fontWeight:700}}>+ Add</button>
          </div>
        </div>

        {/* Entries list */}
        <div style={{background:'var(--w)',borderRadius:8,overflow:'hidden'}}>
          {monthEntries.length===0 ? (
            <div style={{textAlign:'center',color:'var(--t3)',padding:'40px 0',fontSize:13,border:'2px dashed var(--bd)',borderRadius:8,margin:0}}>No personal expenses for {MONTHS_LONG[month]} {year}</div>
          ) : (
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead>
                <tr style={{background:'var(--g0)',borderBottom:'1px solid var(--bd)'}}>
                  <th style={{padding:'8px 14px',textAlign:'left',color:'var(--t3)',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px',width:90}}>Date</th>
                  <th style={{padding:'8px 14px',textAlign:'left',color:'var(--t3)',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px',width:130}}>Category</th>
                  <th style={{padding:'8px 14px',textAlign:'left',color:'var(--t3)',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px'}}>Description</th>
                  <th style={{padding:'8px 14px',textAlign:'right',color:'var(--t3)',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px',width:120}}>Amount ₹</th>
                  <th style={{padding:'8px 14px',width:40}}></th>
                </tr>
              </thead>
              <tbody>
                {[...monthEntries].sort((a,b)=>b.date.localeCompare(a.date)||(b.id||'').localeCompare(a.id||'')).map(e=>{
                  const c=catObj[e.cat]||{label:e.cat,icon:'',color:'var(--t1)'};
                  const dt=new Date(e.date+'T00:00:00');
                  const dStr=`${String(dt.getDate()).padStart(2,'0')} ${MONTHS_LONG[dt.getMonth()].slice(0,3)}`;
                  return (
                    <tr key={e.id} style={{borderBottom:'1px solid var(--bd)'}}>
                      <td style={{padding:'7px 14px',color:'var(--t2)'}}>{dStr}</td>
                      <td style={{padding:'7px 14px'}}><span style={{color:c.color,fontWeight:600}}>{c.icon} {c.label}</span></td>
                      <td style={{padding:'7px 14px',color:e.desc?'var(--t1)':'var(--t3)',fontStyle:e.desc?'normal':'italic'}}>{e.desc||'—'}</td>
                      <td style={{padding:'7px 14px',textAlign:'right',fontFamily:"'Noto Sans Mono',monospace",fontWeight:600,color:'var(--redtx)'}}>{inrZ(e.amount)}</td>
                      <td style={{padding:'7px 14px',textAlign:'center'}}><span onClick={()=>del(e.id)} style={{cursor:'pointer',color:'var(--red)',fontSize:13}}>×</span></td>
                    </tr>
                  );
                })}
                <tr style={{background:'var(--g0)',borderTop:'2px solid var(--bd2)'}}>
                  <td colSpan="3" style={{padding:'10px 14px',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.5px',fontSize:11}}>Total</td>
                  <td style={{padding:'10px 14px',textAlign:'right',fontFamily:"'Noto Sans Mono',monospace",fontWeight:700,fontSize:13,color:'var(--redtx)'}}>{inrZ(total)}</td>
                  <td></td>
                </tr>
              </tbody>
            </table>
          )}
        </div>
      </div>
    </>
  );
}

// EXPORT TAB
// ═══════════════════════════════════════════════════════════════
function ExportView({ allData, setAllData, ipRecords, setIpRecords }){
  const td=today(); const ty=parseInt(td.slice(0,4)); const tm=parseInt(td.slice(5,7))-1;
  const [year,setYear]=useState(ty); const [month,setMonth]=useState(tm);
  const [fromYM,setFromYM]=useState(`${ty}-${String(tm+1).padStart(2,'0')}`);
  const [toYM,setToYM]=useState(`${ty}-${String(tm+1).padStart(2,'0')}`);
  const [dayDate,setDayDate]=useState(today());
  const [importMsg,setImportMsg]=useState('');
  const [importErr,setImportErr]=useState(false);

  const ms=`${year}-${String(month+1).padStart(2,'0')}`;

  // CSV utilities
  function csvCell(v){
    if(v===null||v===undefined)return '';
    const s=String(v);
    if(s.includes(',')||s.includes('"')||s.includes('\n'))return '"'+s.replace(/"/g,'""')+'"';
    return s;
  }
  function downloadCsv(name,rows){
    if(!rows||rows.length===0){alert('No data to export');return;}
    const csv=rows.map(r=>r.map(csvCell).join(',')).join('\n');
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name; a.click();
    URL.revokeObjectURL(url);
  }

  // ─── Builders ───
  function buildDayRegister(monthStr){
    const rows=[['Date','Day','MRN','Name','Type','OPD','XRay','POPD','PT','Lab','Medicals','Mode','Cash','GPay','Total']];
    Object.keys(allData).filter(d=>d.startsWith(monthStr)).sort().forEach(d=>{
      const dt=new Date(d+'T00:00:00');
      const day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()];
      (allData[d]||[]).forEach(r=>{
        rows.push([d,day,r.mrn,r.name,r.type,n(r.opd),n(r.xray),n(r.popd),n(r.pt),n(r.lab),n(r.medicals),r.mode,n(r.cash),n(r.gpay),calcTotal(r)]);
      });
    });
    return rows;
  }
  function buildMonthlySummary(monthStr){
    const rows=[['Date','Day','Patients','Consult','XPL','Medical','Total']];
    const [y,m]=monthStr.split('-').map(Number);
    const days=new Date(y,m,0).getDate();
    for(let d=1;d<=days;d++){
      const ds=`${monthStr}-${String(d).padStart(2,'0')}`;
      const list=allData[ds]||[];
      const consult=list.reduce((s,r)=>s+n(r.opd)+n(r.popd),0);
      const xpl=list.reduce((s,r)=>s+n(r.xray)+n(r.pt)+n(r.lab),0);
      const medical=list.reduce((s,r)=>s+n(r.medicals),0);
      const dt=new Date(ds+'T00:00:00');
      rows.push([ds,['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()],list.length,consult,xpl,medical,consult+xpl+medical]);
    }
    return rows;
  }
  function buildIp(monthStr){
    const rows=[['MRN','Name','AdmitDate','DischargeDate','Diagnosis','IPBill','IPMed','Total']];
    (ipRecords||[]).forEach(r=>{
      const adm=r.admitDate||r.date||'';
      if(adm.startsWith(monthStr)){
        rows.push([r.mrn||'',r.name||'',adm,r.dischargeDate||'',r.diagnosis||'',n(r.ipBill||r.bill),n(r.ipMed||r.medicines),n(r.ipBill||r.bill)+n(r.ipMed||r.medicines)]);
      }
    });
    return rows;
  }
  function buildPharma(monthStr){
    const rows=[['Date','Agency','Amount','Paid','Due','Mode']];
    let pharma=[]; try{pharma=JSON.parse(localStorage.getItem(PHARMA_KEY)||'[]');}catch{}
    pharma.filter(e=>e.date&&e.date.startsWith(monthStr)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
      rows.push([e.date,e.agency,n(e.amount),n(e.paid),n(e.amount)-n(e.paid),e.mode||'']);
    });
    return rows;
  }
  function buildStaff(){
    const rows=[['Name','JoinDate','CurrentSalary','SalaryHistory']];
    let staff=[]; try{staff=JSON.parse(localStorage.getItem(STAFF_KEY)||'[]');}catch{}
    const cur=`${ty}-${String(tm+1).padStart(2,'0')}`;
    staff.forEach(s=>{
      const hist=(s.salaryHistory||[]).map(h=>`${h.effectiveMonth}:${h.amount}`).join('; ');
      rows.push([s.name,s.joinDate||'',salaryFor(s,cur),hist]);
    });
    return rows;
  }
  function buildPnl(monthStr){
    let staff=[],staffPaid={},pharma=[],manual={};
    try{staff=JSON.parse(localStorage.getItem(STAFF_KEY)||'[]');}catch{}
    try{staffPaid=JSON.parse(localStorage.getItem(STAFF_PAID_KEY)||'{}');}catch{}
    try{pharma=JSON.parse(localStorage.getItem(PHARMA_KEY)||'[]');}catch{}
    try{manual=JSON.parse(localStorage.getItem(PNL_KEY)||'{}');}catch{}
    const [y,m]=monthStr.split('-').map(Number);
    const x=computePnlMonth(y,m-1,{allData,ipRecords,pharma,staff,staffPaid,manual});
    const rec=migratePnlMonth(manual[monthStr]||{},monthStr);
    return [
      ['Category','Type','Amount'],
      ['OPD','Income',x.opd],
      ['IP','Income',x.ip],
      ['Pharma sales','Income',x.pharmaSales],
      ['Total Income','Income',x.totalIncome],
      ['Pharma purchases (paid)','Expense',x.pharmaPaid],
      ['Staff salary (paid)','Expense',x.staffCash],
      ['Rent','Expense',sumEntries(rec.rent)],
      ['Utilities','Expense',sumEntries(rec.utilities)],
      ['Internet','Expense',sumEntries(rec.internet)],
      ['Electricity','Expense',sumEntries(rec.electricity)],
      ['Other','Expense',sumEntries(rec.other)],
      ['Total Expenses','Expense',x.totalExp],
      ['Net Profit','Net',x.net]
    ];
  }
  function buildPersonal(monthStr){
    const rows=[['Date','Category','Description','Amount']];
    let entries=[]; try{entries=JSON.parse(localStorage.getItem(PERSONAL_KEY)||'[]');}catch{}
    entries.filter(e=>e.date&&e.date.startsWith(monthStr)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
      rows.push([e.date,e.cat,e.desc||'',n(e.amount)]);
    });
    return rows;
  }
  function buildAnnual(yr){
    let staff=[],staffPaid={},pharma=[],manual={};
    try{staff=JSON.parse(localStorage.getItem(STAFF_KEY)||'[]');}catch{}
    try{staffPaid=JSON.parse(localStorage.getItem(STAFF_PAID_KEY)||'{}'); }catch{}
    try{pharma=JSON.parse(localStorage.getItem(PHARMA_KEY)||'[]');}catch{}
    try{manual=JSON.parse(localStorage.getItem(PNL_KEY)||'{}');}catch{}
    const rows=[['Month','OPD','IP','PharmaSales','GrossRev','PharmaCost','StaffCost','Rent','Util','Internet','Electricity','Other','TotalExp','Net']];
    for(let m=0;m<12;m++){
      const ms=`${yr}-${String(m+1).padStart(2,'0')}`;
      const x=computePnlMonth(yr,m,{allData,ipRecords,pharma,staff,staffPaid,manual});
      const rec=migratePnlMonth(manual[ms]||{},ms);
      const r=sumEntries(rec.rent),u=sumEntries(rec.utilities),i=sumEntries(rec.internet),e=sumEntries(rec.electricity),o=sumEntries(rec.other);
      rows.push([`${MONTHS_LONG[m]} ${yr}`,x.opd,x.ip,x.pharmaSales,x.totalIncome,x.pharmaPaid,x.staffCash,r,u,i,e,o,x.totalExp,x.net]);
    }
    return rows;
  }

  // ─── Quarterly: combine multiple months ───
  function exportQuarterly(){
    if(fromYM>toYM){alert('From must be ≤ To');return;}
    // walk months
    const out=[['Date','Day','MRN','Name','Type','OPD','XRay','POPD','PT','Lab','Medicals','Mode','Cash','GPay','Total']];
    Object.keys(allData).sort().forEach(d=>{
      const ms2=d.slice(0,7);
      if(ms2>=fromYM&&ms2<=toYM){
        const dt=new Date(d+'T00:00:00');
        const day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()];
        (allData[d]||[]).forEach(r=>{
          out.push([d,day,r.mrn,r.name,r.type,n(r.opd),n(r.xray),n(r.popd),n(r.pt),n(r.lab),n(r.medicals),r.mode,n(r.cash),n(r.gpay),calcTotal(r)]);
        });
      }
    });
    if(out.length<=1){alert('No data in range');return;}
    downloadCsv(`vh-day-register_${fromYM}_to_${toYM}.csv`,out);
  }

  // ─── Day-specific ───
  function exportDay(){
    if(!dayDate){alert('Pick a date');return;}
    const rows=[['MRN','Name','Type','OPD','XRay','POPD','PT','Lab','Medicals','Mode','Cash','GPay','Total']];
    (allData[dayDate]||[]).forEach(r=>{
      rows.push([r.mrn,r.name,r.type,n(r.opd),n(r.xray),n(r.popd),n(r.pt),n(r.lab),n(r.medicals),r.mode,n(r.cash),n(r.gpay),calcTotal(r)]);
    });
    if(rows.length<=1){alert('No data for this date');return;}
    downloadCsv(`vh-day_${dayDate}.csv`,rows);
  }

  // ─── Full data export (everything combined) ───
  function exportFull(){
    const ts=today();
    const sections={
      day:{},ip:[],pharma:[],staff:[],staffPaid:{},personal:[],pnlManual:{},pharmaAgencies:[]
    };
    sections.day=allData;
    sections.ip=ipRecords;
    try{sections.pharma=JSON.parse(localStorage.getItem(PHARMA_KEY)||'[]');}catch{}
    try{sections.pharmaAgencies=JSON.parse(localStorage.getItem(PHARMA_AGENCIES_KEY)||'[]');}catch{}
    try{sections.staff=JSON.parse(localStorage.getItem(STAFF_KEY)||'[]');}catch{}
    try{sections.staffPaid=JSON.parse(localStorage.getItem(STAFF_PAID_KEY)||'{}');}catch{}
    try{sections.personal=JSON.parse(localStorage.getItem(PERSONAL_KEY)||'[]');}catch{}
    try{sections.pnlManual=JSON.parse(localStorage.getItem(PNL_KEY)||'{}');}catch{}
    // build combined CSV with section markers
    const lines=[];
    lines.push(['== DAY DATA ==']);
    lines.push(['Date','MRN','Name','Type','OPD','XRay','POPD','PT','Lab','Medicals','Mode','Cash','GPay','Total']);
    Object.keys(sections.day).sort().forEach(d=>{
      (sections.day[d]||[]).forEach(r=>lines.push([d,r.mrn,r.name,r.type,n(r.opd),n(r.xray),n(r.popd),n(r.pt),n(r.lab),n(r.medicals),r.mode,n(r.cash),n(r.gpay),calcTotal(r)]));
    });
    lines.push(['']); lines.push(['== IP RECORDS ==']);
    lines.push(['MRN','Name','AdmitDate','DischargeDate','Diagnosis','IPBill','IPMed']);
    sections.ip.forEach(r=>lines.push([r.mrn||'',r.name||'',r.admitDate||r.date||'',r.dischargeDate||'',r.diagnosis||'',n(r.ipBill||r.bill),n(r.ipMed||r.medicines)]));
    lines.push(['']); lines.push(['== PHARMA ==']);
    lines.push(['Date','Agency','Amount','Paid','Mode']);
    sections.pharma.forEach(e=>lines.push([e.date,e.agency,n(e.amount),n(e.paid),e.mode||'']));
    lines.push(['']); lines.push(['== STAFF ==']);
    lines.push(['Name','JoinDate','CurrentSalary','SalaryHistory']);
    const cur=`${ty}-${String(tm+1).padStart(2,'0')}`;
    sections.staff.forEach(s=>lines.push([s.name,s.joinDate||'',salaryFor(s,cur),(s.salaryHistory||[]).map(h=>`${h.effectiveMonth}:${h.amount}`).join('; ')]));
    lines.push(['']); lines.push(['== PERSONAL ==']);
    lines.push(['Date','Category','Description','Amount']);
    sections.personal.forEach(e=>lines.push([e.date,e.cat,e.desc||'',n(e.amount)]));
    downloadCsv(`vh-full-export_${ts}.csv`,lines);
  }

  // ─── JSON Backup / Restore ───
  function downloadJsonBackup(){
    const ts=today();
    const payload={
      version:'v8',
      exportedAt:new Date().toISOString(),
      data:{
        'vh-day-data':allData,
        'vh-ip-records':ipRecords,
      }
    };
    // Pull all VH localStorage keys generically
    const keys=[PHARMA_KEY,PHARMA_AGENCIES_KEY,STAFF_KEY,STAFF_PAID_KEY,PERSONAL_KEY,PNL_KEY];
    keys.forEach(k=>{
      try{const v=localStorage.getItem(k); if(v!==null)payload.data[k]=JSON.parse(v);}catch{}
    });
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`vh-backup_${ts}.json`; a.click();
    URL.revokeObjectURL(url);
  }

  function handleImport(file){
    if(!file)return;
    setImportMsg(''); setImportErr(false);
    if(!confirm('Importing will REPLACE all current data. Continue?'))return;
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const obj=JSON.parse(e.target.result);
        const data=obj.data||obj; // support both wrapped and bare
        // Day data
        if(data['vh-day-data']){
          localStorage.setItem('vh-day-data',JSON.stringify(data['vh-day-data']));
          setAllData(data['vh-day-data']);
        }
        // IP
        if(data['vh-ip-records']){
          localStorage.setItem('vh-ip-records',JSON.stringify(data['vh-ip-records']));
          setIpRecords(data['vh-ip-records']);
        }
        // Other keys
        [PHARMA_KEY,PHARMA_AGENCIES_KEY,STAFF_KEY,STAFF_PAID_KEY,PERSONAL_KEY,PNL_KEY].forEach(k=>{
          if(data[k]!==undefined)localStorage.setItem(k,JSON.stringify(data[k]));
        });
        setImportMsg(`✓ Imported successfully on ${new Date().toLocaleString()}. Reloading…`);
        setTimeout(()=>window.location.reload(),1500);
      }catch(err){
        setImportMsg('Import failed: '+err.message);
        setImportErr(true);
      }
    };
    reader.readAsText(file);
  }

  // Card component
  const Card=({icon,title,sub,bg,iconColor,onClick})=>(
    <div style={{background:'var(--w)',borderRadius:8,padding:14,minWidth:180,flex:'1 1 200px',display:'flex',flexDirection:'column',gap:8}}>
      <div style={{width:36,height:36,borderRadius:8,background:bg,color:iconColor||'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{icon}</div>
      <div>
        <div style={{fontSize:14,fontWeight:700,color:'var(--t1)'}}>{title}</div>
        <div style={{fontSize:11,color:'var(--t3)',marginTop:2,lineHeight:1.4}}>{sub}</div>
      </div>
      <button onClick={onClick} style={{background:'transparent',border:'none',padding:0,color:bg,fontSize:11,fontWeight:700,cursor:'pointer',textAlign:'left',marginTop:'auto',textTransform:'uppercase',letterSpacing:'0.5px'}}>⬇ Download CSV</button>
    </div>
  );

  // Year options for annual
  const yearOpts=(()=>{
    let min=ty;
    Object.keys(allData||{}).forEach(d=>{const y=parseInt(d.slice(0,4));if(y<min)min=y;});
    const arr=[]; for(let y=min;y<=ty+1;y++)arr.push(y); return arr;
  })();

  // Month options (last 24 months)
  const monthOpts=(()=>{
    const arr=[]; let y=ty,m=tm;
    for(let i=0;i<24;i++){arr.push(`${y}-${String(m+1).padStart(2,'0')}`);m--;if(m<0){m=11;y--;}}
    return arr;
  })();
  function fmtMs(ms){const [y,m]=ms.split('-').map(Number);return `${MONTHS_LONG[m-1]} ${y}`;}

  return (
    <div style={{flex:1,overflowY:'auto',background:'#dde8f5',padding:14}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,flexWrap:'wrap'}}>
        <span style={{fontSize:18,fontWeight:700}}>📤 Export & Backup</span>
        <select value={ms} onChange={e=>{const [y,m]=e.target.value.split('-').map(Number);setYear(y);setMonth(m-1);}}
          style={{border:'1px solid var(--bd2)',borderRadius:5,padding:'7px 10px',fontSize:12,background:'var(--w)',outline:'none'}}>
          {monthOpts.map(o=><option key={o} value={o}>{fmtMs(o)}</option>)}
        </select>
      </div>

      {/* CSV Cards */}
      <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:14}}>
        <Card icon="📋" title="Day Register" sub="All patient entries for selected month" bg="#1565c0" onClick={()=>downloadCsv(`vh-day-register_${ms}.csv`,buildDayRegister(ms))}/>
        <Card icon="📅" title="Monthly Summary" sub="Day-wise revenue summary" bg="#6a1b9a" onClick={()=>downloadCsv(`vh-monthly_${ms}.csv`,buildMonthlySummary(ms))}/>
        <Card icon="🏥" title="IP Patients" sub="All inpatient records for month" bg="#0f7553" onClick={()=>downloadCsv(`vh-ip_${ms}.csv`,buildIp(ms))}/>
        <Card icon="💊" title="Pharma Tracker" sub="Pharma purchase entries for month" bg="#c62828" onClick={()=>downloadCsv(`vh-pharma_${ms}.csv`,buildPharma(ms))}/>
        <Card icon="📊" title="P&L Summary" sub="Full P&L breakdown for month" bg="#e65100" onClick={()=>downloadCsv(`vh-pnl_${ms}.csv`,buildPnl(ms))}/>
        <Card icon="👥" title="Staff Salaries" sub="Complete staff salary list" bg="#2e7d32" onClick={()=>downloadCsv(`vh-staff_${ms}.csv`,buildStaff())}/>
        <Card icon="💼" title="Personal Expenses" sub="Personal entries for month" bg="#5d4037" onClick={()=>downloadCsv(`vh-personal_${ms}.csv`,buildPersonal(ms))}/>
        <Card icon="📈" title="Annual Report" sub={`Full year breakdown for ${year}`} bg="#00838f" onClick={()=>downloadCsv(`vh-annual_${year}.csv`,buildAnnual(year))}/>
      </div>

      {/* Quarterly */}
      <div style={{background:'var(--w)',borderRadius:8,padding:14,marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:700,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:10}}>📅 Quarterly Export</div>
        <div style={{display:'flex',gap:10,alignItems:'flex-end',flexWrap:'wrap'}}>
          <label style={{display:'flex',flexDirection:'column',gap:3}}>
            <span style={{fontSize:10,color:'var(--t3)',fontWeight:600}}>From Month</span>
            <select value={fromYM} onChange={e=>setFromYM(e.target.value)} style={{border:'1px solid var(--bd2)',borderRadius:5,padding:'7px 10px',fontSize:12,background:'var(--w)',outline:'none'}}>
              {monthOpts.map(o=><option key={o} value={o}>{fmtMs(o)}</option>)}
            </select>
          </label>
          <label style={{display:'flex',flexDirection:'column',gap:3}}>
            <span style={{fontSize:10,color:'var(--t3)',fontWeight:600}}>To Month</span>
            <select value={toYM} onChange={e=>setToYM(e.target.value)} style={{border:'1px solid var(--bd2)',borderRadius:5,padding:'7px 10px',fontSize:12,background:'var(--w)',outline:'none'}}>
              {monthOpts.map(o=><option key={o} value={o}>{fmtMs(o)}</option>)}
            </select>
          </label>
          <button onClick={exportQuarterly} style={{background:'#1a1a1a',color:'#fff',border:'none',borderRadius:5,padding:'8px 16px',fontSize:12,fontWeight:600,cursor:'pointer'}}>⬇ Export Quarterly CSV</button>
        </div>
      </div>

      {/* Day-specific */}
      <div style={{background:'var(--w)',borderRadius:8,padding:14,marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:700,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:10}}>📆 Day-Specific Export</div>
        <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
          <input type="date" value={dayDate} onChange={e=>setDayDate(e.target.value)} style={{border:'1px solid var(--bd2)',borderRadius:5,padding:'7px 10px',fontSize:12,outline:'none'}}/>
          <button onClick={exportDay} style={{background:'#1a1a1a',color:'#fff',border:'none',borderRadius:5,padding:'8px 16px',fontSize:12,fontWeight:600,cursor:'pointer'}}>⬇ Export Day CSV</button>
        </div>
      </div>

      {/* Full export */}
      <div style={{background:'var(--w)',borderRadius:8,padding:14,marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:700,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:8}}>📦 Full Data Export</div>
        <div style={{fontSize:12,color:'var(--t2)',marginBottom:10}}>Export all data (Day, IP, Pharma, Staff, Personal) in a single combined CSV file with section markers.</div>
        <button onClick={exportFull} style={{background:'#1a1a1a',color:'#fff',border:'none',borderRadius:5,padding:'8px 16px',fontSize:12,fontWeight:600,cursor:'pointer'}}>⬇ Download Complete Export</button>
      </div>

      {/* JSON Backup & Restore */}
      <div style={{background:'var(--w)',borderRadius:8,padding:14,marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:700,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:8}}>🔄 Backup & Restore (JSON)</div>
        <div style={{fontSize:12,color:'var(--t2)',marginBottom:10}}>Download a complete JSON backup of all your hospital data, or upload a previous backup to restore it. Use this regularly — store the file on Google Drive for cross-device access.</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button onClick={downloadJsonBackup} style={{background:'#5e35b1',color:'#fff',border:'none',borderRadius:5,padding:'8px 16px',fontSize:12,fontWeight:600,cursor:'pointer'}}>⬇ Download Backup JSON</button>
          <label style={{background:'#5e35b1',color:'#fff',border:'none',borderRadius:5,padding:'8px 16px',fontSize:12,fontWeight:600,cursor:'pointer'}}>
            ⬆ Import from JSON
            <input type="file" accept=".json,application/json" onChange={e=>handleImport(e.target.files[0])} style={{display:'none'}}/>

        {importMsg&&<div style={{marginTop:8,fontSize:11,color:importErr?'var(--redtx)':'var(--grntx)',fontWeight:600}}>{importMsg}</div>}
        <div style={{fontSize:10,color:'var(--ambtx)',marginTop:8}}>⚠ Importing will replace all current data with the backup contents.</div>
      </div>

      {/* Where is data saved */}
      <div style={{background:'#e3f2fd',border:'1px solid #1565c0',borderRadius:8,padding:14}}>
        <div style={{fontSize:11,fontWeight:700,color:'var(--blutx)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:12}}>ℹ Where is your data saved?</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr',gap:10}}>
          <div style={{background:'var(--w)',borderRadius:6,padding:'10px 12px'}}>
            <div style={{fontSize:12,fontWeight:700,color:'var(--blutx)',marginBottom:4}}>📱 This Device (Local Storage)</div>
            <div style={{fontSize:11,color:'var(--t2)',lineHeight:1.5}}>All data is saved in your browser's local storage. It stays even after closing the tab, but is tied to <b>this device and browser</b>.</div>
            <div style={{fontSize:10,color:'var(--t3)',marginTop:6,fontFamily:"'Noto Sans Mono',monospace",background:'var(--g0)',padding:'4px 8px',borderRadius:4,display:'inline-block'}}>Keys: vh-day-data, vh-ip-records, vh-pharma-data, vh-staff-data, vh-personal, vh-pnl-manual</div>
          </div>
          <div style={{background:'var(--w)',borderRadius:6,padding:'10px 12px'}}>
            <div style={{fontSize:12,fontWeight:700,color:'var(--ambtx)',marginBottom:4}}>☁ Cross-Device Strategy</div>
            <div style={{fontSize:11,color:'var(--t2)',lineHeight:1.5}}>Cloud auto-sync (Firebase) is planned for Phase 2. <b>For now</b>:</div>
            <ul style={{fontSize:11,color:'var(--t2)',lineHeight:1.6,marginTop:4,paddingLeft:18}}>
              <li>Download Backup JSON every Sunday</li>
              <li>Save it in your <b>Google Drive folder</b> (auto-syncs across devices)</li>
              <li>On a new device → Import from JSON → fully restored</li>
            </ul>
          </div>
        </div>
        <div style={{fontSize:11,color:'var(--t2)',marginTop:10,paddingTop:10,borderTop:'1px solid var(--bd)'}}>
          <b>Tip:</b> Use <i>Download Backup JSON</i> button regularly. If you switch devices, just import that JSON on the new device and everything is restored instantly.
        </div>
      </div>
    </div>
  );
}

// SETTINGS TAB
// ═══════════════════════════════════════════════════════════════
function BackupImporter(){
  const [backup,setBackup]=useState(null);
  const [plan,setPlan]=useState(null);
  const [log,setLog]=useState([]);
  const [busy,setBusy]=useState(false);

  function add(line){setLog(L=>[line,...L].slice(0,15));}

  function transformRow(r){
    const modeMap={C:'Cash',G:'Gpay',CG:'Cash'};
    return {
      id:uid(),mrn:r.mrn||'',name:r.name||'',type:r.type||'N',
      opd:r.opd||'',xray:r.xray||'',popd:r.pop||'',pt:r.pt||'',lab:r.lab||'',
      medicals:r.med||'',
      mode:modeMap[r.mode]||r.mode||'Cash',
      cash:r.cash||'',gpay:r.gpay||''
    };
  }

  async function onFile(e){
    const f=e.target.files[0]; if(!f)return;
    try{
      const txt=await f.text();
      const data=JSON.parse(txt);
      if(!data.opd||!data.pharma){alert('Not a valid VH backup file (missing opd/pharma keys).');return;}
      setBackup(data);
      buildPlan(data);
      add(`Loaded: ${f.name}`);
    }catch(err){alert('Invalid JSON: '+err.message);}
  }

  function buildPlan(data){
    const CUTOFF='2026-04-24';
    const opdDates=Object.keys(data.opd||{}).filter(d=>d>=CUTOFF).sort();
    let existingOpd={};try{existingOpd=JSON.parse(localStorage.getItem('vh-day-data')||'{}');}catch{}
    let existingPharma=[];try{existingPharma=JSON.parse(localStorage.getItem(PHARMA_KEY)||'[]');}catch{}
    const overlap=opdDates.filter(d=>existingOpd[d]&&existingOpd[d].length>0);
    const newDates=opdDates.filter(d=>!(existingOpd[d]&&existingOpd[d].length>0));
    let rowCount=0;newDates.forEach(d=>rowCount+=(data.opd[d].rows||[]).length);
    let pharmaCount=0;const ags=new Set();
    Object.keys(data.pharma||{}).forEach(ms=>{
      Object.keys(data.pharma[ms]).forEach(ag=>{
        if(ag.endsWith('_paid'))return;
        const e=data.pharma[ms][ag];
        if(Array.isArray(e)){pharmaCount+=e.length;ags.add(ag);}
      });
    });
    setPlan({opdDates,overlap,newDates,rowCount,pharmaCount,agencyCount:ags.size,existingPharmaCount:existingPharma.length,existingOpdCount:Object.keys(existingOpd).length,sourceRange:opdDates.length?`${opdDates[0]} → ${opdDates[opdDates.length-1]}`:'—'});
  }

  function applyOpd(){
    if(!backup||!plan)return;
    if(!confirm(`Add ${plan.newDates.length} new dates (${plan.rowCount} rows) to OPD?\n\nExisting dates will NOT be overwritten.`))return;
    setBusy(true);
    try{
      let existing={};try{existing=JSON.parse(localStorage.getItem('vh-day-data')||'{}');}catch{}
      const updated={...existing};
      let added=0,skipped=0,rowsAdded=0;
      plan.opdDates.forEach(d=>{
        if(existing[d]&&existing[d].length>0){skipped++;return;}
        const rows=(backup.opd[d].rows||[]).map(transformRow);
        updated[d]=rows; added++; rowsAdded+=rows.length;
      });
      localStorage.setItem('vh-day-data',JSON.stringify(updated));
      add(`✓ OPD: added ${added} dates, ${rowsAdded} rows. Skipped ${skipped}.`);
      buildPlan(backup); // refresh plan
    }catch(err){add('✗ OPD error: '+err.message);}
    setBusy(false);
  }

  function applyPharma(){
    if(!backup||!plan)return;
    if(!confirm(`Load ${plan.pharmaCount} pharma entries from JSON?\n\nExisting pharma data will be REPLACED.\nAgencies will be merged with existing list.`))return;
    setBusy(true);
    try{
      const flat=[];const ags=new Set();
      Object.keys(backup.pharma||{}).forEach(ms=>{
        const m=backup.pharma[ms];
        Object.keys(m).forEach(ag=>{
          if(ag.endsWith('_paid'))return;
          const e=m[ag];if(!Array.isArray(e))return;
          ags.add(ag);
          e.forEach(x=>flat.push({id:uid(),date:x.date,agency:ag,amount:n(x.amt),paid:0,mode:''}));
        });
      });
      flat.sort((a,b)=>a.date.localeCompare(b.date));
      let existingAgs=[];try{existingAgs=JSON.parse(localStorage.getItem(PHARMA_AGENCIES_KEY)||'[]');}catch{}
      const merged=Array.from(new Set([...existingAgs,...ags])).sort();
      localStorage.setItem(PHARMA_KEY,JSON.stringify(flat));
      localStorage.setItem(PHARMA_AGENCIES_KEY,JSON.stringify(merged));
      add(`✓ Pharma: wrote ${flat.length} entries, ${merged.length} agencies. Refresh recommended.`);
      buildPlan(backup);
    }catch(err){add('✗ Pharma error: '+err.message);}
    setBusy(false);
  }

  function reload(){window.location.reload();}

  const card={background:'var(--w)',border:'1px solid var(--bd)',borderRadius:10,padding:'16px 18px',marginBottom:14,borderLeft:'4px solid #d97706'};
  const btn=(bg,disabled)=>({background:disabled?'#ccc':bg,color:'#fff',border:'none',borderRadius:7,padding:'9px 16px',fontSize:12,fontWeight:700,cursor:disabled?'not-allowed':'pointer',marginRight:8});

  return (
    <div style={card}>
      <div style={{fontWeight:700,fontSize:13,color:'#b45309',marginBottom:4}}>📥 Import Backup JSON</div>
      <p style={{fontSize:12,color:'var(--t3)',marginBottom:12,lineHeight:1.6}}>
        One-click loader. Pick a backup JSON file → review what will change → apply.
        OPD existing dates are protected (skipped). Pharma is fully replaced.
      </p>

      <input type="file" accept=".json,application/json" onChange={onFile}
        style={{fontSize:12,padding:'7px 10px',border:'1px dashed var(--bd2)',borderRadius:6,background:'var(--g0)',width:'100%',cursor:'pointer'}}/>

      {plan&&(
        <div style={{marginTop:12,padding:'12px 14px',background:'var(--g0)',borderRadius:7,fontSize:12,lineHeight:1.7}}>
          <div style={{fontWeight:700,marginBottom:6,color:'var(--t1)'}}>Merge plan</div>
          <table style={{width:'100%',fontSize:12,borderCollapse:'collapse'}}>
            <tbody>
              <tr><td style={{color:'var(--t3)',padding:'3px 0'}}>OPD source dates (Apr 24+)</td><td style={{textAlign:'right',fontWeight:600}}>{plan.opdDates.length} <span style={{color:'var(--t3)',fontWeight:400}}>({plan.sourceRange})</span></td></tr>
              <tr><td style={{color:'var(--t3)',padding:'3px 0'}}>Already in storage (will skip)</td><td style={{textAlign:'right',fontWeight:600,color:plan.overlap.length?'var(--redtx)':'var(--grntx)'}}>{plan.overlap.length}</td></tr>
              <tr><td style={{color:'var(--t3)',padding:'3px 0'}}>New OPD dates to add</td><td style={{textAlign:'right',fontWeight:700,color:'var(--grntx)'}}>{plan.newDates.length} ({plan.rowCount} rows)</td></tr>
              <tr><td style={{color:'var(--t3)',padding:'3px 0'}}>Existing OPD total</td><td style={{textAlign:'right'}}>{plan.existingOpdCount}</td></tr>
              <tr><td style={{color:'var(--t3)',padding:'3px 0',paddingTop:8,borderTop:'1px solid var(--bd)'}}>Pharma entries to load</td><td style={{textAlign:'right',fontWeight:700,color:'var(--blutx)',paddingTop:8,borderTop:'1px solid var(--bd)'}}>{plan.pharmaCount} ({plan.agencyCount} agencies)</td></tr>
              <tr><td style={{color:'var(--t3)',padding:'3px 0'}}>Existing pharma (will replace)</td><td style={{textAlign:'right',fontWeight:600,color:plan.existingPharmaCount?'var(--redtx)':'var(--t3)'}}>{plan.existingPharmaCount}</td></tr>
            </tbody>
          </table>
          {plan.overlap.length>0&&<div style={{marginTop:8,fontSize:11,color:'var(--redtx)'}}>Overlap dates skipped: {plan.overlap.join(', ')}</div>}

          <div style={{marginTop:14,display:'flex',flexWrap:'wrap',alignItems:'center'}}>
            <button style={btn('#1565c0',busy||plan.newDates.length===0)} onClick={applyOpd} disabled={busy||plan.newDates.length===0}>
              ① Apply OPD merge
            </button>
            <button style={btn('#7c3aed',busy)} onClick={applyPharma} disabled={busy}>
              ② Apply Pharma load
            </button>
            <button style={btn('#16a34a',busy)} onClick={reload} disabled={busy}>
              ③ Refresh page
            </button>
          </div>
        </div>
      )}

      {log.length>0&&(
        <div style={{marginTop:12,padding:'10px 12px',background:'#0f172a',color:'#e2e8f0',borderRadius:6,fontSize:11,fontFamily:"'Noto Sans Mono',monospace",lineHeight:1.6,maxHeight:140,overflowY:'auto'}}>
          {log.map((l,i)=><div key={i}>{l}</div>)}
        </div>
      )}
    </div>
  );
}

function SettingsView({ allData, ipRecords, syncStatus, setSyncStatus }) {
  const [url, setUrl] = useState(getGsUrl);
  const [syncing, setSyncing] = useState(false);
  const [msg, setMsg] = useState('');
  const [err, setErr] = useState(false);
  const lastSync = getGsLast();

  function saveUrl() {
    setGsUrl(url.trim());
    setMsg('URL saved ✓'); setErr(false);
    setTimeout(() => setMsg(''), 2000);
  }

  async function doSync() {
    const u = getGsUrl();
    if (!u) { setMsg('Paste your Apps Script URL first'); setErr(true); return; }
    setSyncing(true); setMsg('Syncing to Google Sheets…'); setErr(false);
    const res = await syncToSheets(allData, ipRecords, u);
    setSyncing(false);
    if (res.ok) { setMsg(`✓ Synced at ${res.msg}`); setErr(false); setSyncStatus('ok'); }
    else { setMsg(`✗ Failed: ${res.msg}`); setErr(true); setSyncStatus('err'); }
  }

  const cardStyle = { background:'var(--w)', border:'1px solid var(--bd)', borderRadius:10, padding:'16px 18px', marginBottom:14 };
  const labelStyle = { fontSize:11, fontWeight:700, color:'var(--t2)', display:'block', marginBottom:5 };
  const inputStyle = { border:'1px solid var(--bd2)', borderRadius:7, padding:'8px 10px', fontSize:13, color:'var(--t1)', outline:'none', width:'100%', fontFamily:"'Noto Sans',sans-serif" };
  const btnStyle = (bg) => ({ background:bg||'var(--g7)', color:'#fff', border:'none', borderRadius:7, padding:'8px 16px', fontSize:12, fontWeight:700, cursor:'pointer' });

  return (
    <div style={{ flex:1, overflowY:'auto', padding:'16px 20px', background:'var(--bg)' }}>
      <div style={{ maxWidth:640 }}>
        <div style={{ fontWeight:700, fontSize:15, color:'var(--t1)', marginBottom:14 }}>⚙ Settings</div>

        <BackupImporter/>

        {/* Google Sheets Sync */}
        <div style={{ ...cardStyle, borderLeft:'4px solid #34A853' }}>
          <div style={{ fontWeight:700, fontSize:13, color:'#1A7F4B', marginBottom:4 }}>☁ Google Sheets Sync</div>
          <p style={{ fontSize:12, color:'var(--t3)', marginBottom:12, lineHeight:1.6 }}>
            Paste your Google Apps Script Web App URL. Data will sync to your sheet every time you click "Sync Now".
          </p>
          <label style={labelStyle}>Apps Script Web App URL</label>
          <div style={{ display:'flex', gap:8, marginBottom:10 }}>
            <input
              style={{ ...inputStyle, flex:1 }}
              type="url"
              placeholder="https://script.google.com/macros/s/.../exec"
              value={url}
              onChange={e => setUrl(e.target.value)}
            />
            <button style={btnStyle('#1A7F4B')} onClick={saveUrl}>Save</button>
          </div>
          <div style={{ display:'flex', gap:8, alignItems:'center' }}>
            <button style={{ ...btnStyle('#34A853'), opacity: syncing?0.6:1 }} onClick={doSync} disabled={syncing}>
              {syncing ? '⟳ Syncing…' : '⬆ Sync Now'}
            </button>
            {lastSync && <span style={{ fontSize:11, color:'var(--t3)' }}>Last sync: {lastSync}</span>}
          </div>
          {msg && (
            <div style={{ marginTop:10, fontSize:12, fontWeight:600, color: err?'var(--red)':'#16A34A', padding:'7px 10px', borderRadius:6, background: err?'var(--redbg)':'var(--grnbg)' }}>
              {msg}
            </div>
          )}
        </div>

        {/* How to set up */}
        <div style={cardStyle}>
          <div style={{ fontWeight:700, fontSize:13, color:'var(--t1)', marginBottom:8 }}>📋 How to set up Google Sheets sync</div>
          <ol style={{ fontSize:12, color:'var(--t2)', paddingLeft:18, lineHeight:2 }}>
            <li>Open your Google Sheet → Extensions → Apps Script</li>
            <li>Replace the code with the provided <code>Code.gs</code> file</li>
            <li>Click Deploy → Manage Deployments → Edit → New Version → Deploy</li>
            <li>Copy the Web App URL and paste it above</li>
            <li>Click Save then Sync Now</li>
          </ol>
        </div>

        {/* Data info */}
        <div style={{ ...cardStyle, background:'#F0F7FF', borderLeft:'4px solid #2563EB' }}>
          <div style={{ fontWeight:700, fontSize:13, color:'#1D4ED8', marginBottom:6 }}>💾 Data Storage</div>
          <p style={{ fontSize:12, color:'var(--t2)', lineHeight:1.7, margin:0 }}>
            All data is saved in your browser's <strong>localStorage</strong> on this device. Use <strong>Sync Now</strong> to back it up to Google Sheets so you can access it from any device.
          </p>
        </div>
      </div>
    </div>
  );
}

// APP SHELL
// ═══════════════════════════════════════════════════════════════
const TABS = ['Day','Month','IP','Pharma','Staff','P&L','Trends','Export','Personal','Statement','Annual','Settings'];

function TabBar({ active, onTab, syncDot }) {
  const built=['Day','Month','IP','Pharma','Staff','P&L','Trends','Annual','Statement','Personal','Export','Settings'];
  return (
    <div style={{display:'flex',alignItems:'stretch',background:'var(--g7)',paddingLeft:14,gap:2,flexShrink:0,width:'100%'}}>
      <div style={{display:'flex',alignItems:'center',gap:7,paddingRight:16,borderRight:'1px solid rgba(255,255,255,0.15)',marginRight:6}}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="10" y="2" width="4" height="20" rx="1.5" fill="white"/><rect x="2" y="10" width="20" height="4" rx="1.5" fill="white"/></svg>
        <span style={{color:'#fff',fontSize:12,fontWeight:700,letterSpacing:'0.3px'}}>VH Tracker</span>
      </div>
      {TABS.map(t=>{
        const isActive=t===active; const isBuilt=built.includes(t);
        return (
          <div key={t} onClick={()=>isBuilt&&onTab(t)}
            style={{padding:'9px 16px',fontSize:12,fontWeight:600,cursor:isBuilt?'pointer':'default',color:isActive?'var(--g7)':'rgba(255,255,255,0.65)',background:isActive?'var(--w)':'transparent',borderRadius:isActive?'6px 6px 0 0':0,marginTop:4,transition:'all 120ms',opacity:isBuilt?1:0.4,display:'flex',alignItems:'center',gap:5}}
            onMouseEnter={e=>{if(!isActive&&isBuilt)e.currentTarget.style.color='#fff';}}
            onMouseLeave={e=>{if(!isActive)e.currentTarget.style.color='rgba(255,255,255,0.65)';}}>
            {t}
            {t==='Settings'&&syncDot&&<span style={{width:7,height:7,borderRadius:'50%',background:syncDot,display:'inline-block',marginLeft:2}}/>}
          </div>
        );
      })}
    </div>
  );
}

function App() {
  const [tab,setTab]=useState(()=>{try{return localStorage.getItem('vh-tab')||'Day';}catch{return 'Day';}});
  const [date,setDate]=useState(()=>{try{return localStorage.getItem('vh-day-date')||today();}catch{return today();}});
  const [allData,setAllData]=useState(()=>{try{return JSON.parse(localStorage.getItem('vh-day-data')||'{}');}catch{return {};}});
  const [ipRecords,setIpRecords]=useState(()=>{try{return JSON.parse(localStorage.getItem('vh-ip-records')||'[]');}catch{return [];}});
  const [syncStatus,setSyncStatus]=useState(''); // 'ok' | 'err' | ''
  useEffect(()=>{try{localStorage.setItem('vh-tab',tab);}catch{}},[tab]);
  useEffect(()=>{try{localStorage.setItem('vh-day-date',date);}catch{}},[date]);
  const syncDot = syncStatus==='ok'?'#16A34A':syncStatus==='err'?'#D93025':null;
  return (
    <div style={{display:'flex',flexDirection:'column',height:'100vh',width:'100%',overflow:'hidden'}}>
      <TabBar active={tab} onTab={setTab} syncDot={syncDot}/>
      {tab==='Day'&&<DayView allData={allData} setAllData={setAllData} date={date} setDate={setDate}/>}
      {tab==='Month'&&<MonthView allData={allData} date={date} setDate={setDate} setTab={setTab}/>}
      {tab==='IP'&&<IpView ipRecords={ipRecords} setIpRecords={setIpRecords}/>}
      {tab==='Pharma'&&<PharmaView/>}
      {tab==='Staff'&&<StaffView/>}
      {tab==='P&L'&&<PnLView allData={allData} ipRecords={ipRecords}/>}
      {tab==='Trends'&&<TrendsView allData={allData} ipRecords={ipRecords}/>}
      {tab==='Annual'&&<AnnualView allData={allData} ipRecords={ipRecords}/>}
      {tab==='Statement'&&<StatementView allData={allData} ipRecords={ipRecords}/>}
      {tab==='Personal'&&<PersonalView/>}
      {tab==='Export'&&<ExportView allData={allData} setAllData={setAllData} ipRecords={ipRecords} setIpRecords={setIpRecords}/>}
      {tab==='Settings'&&<SettingsView allData={allData} ipRecords={ipRecords} syncStatus={syncStatus} setSyncStatus={setSyncStatus}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
